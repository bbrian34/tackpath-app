<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#010e21">
<title>TackPath in 4 minutes | TackPath demo</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:'TackPath Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url('../tackpath-montserrat-500.ttf')}
:root{--navy:#010e21;--blue:#19b7ef;--text:#edf4fb;--muted:#9bb2c7;--line:#254054}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy);color:var(--text)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* the one title: logo + wordmark + "in 4 minutes", all in the TackPath font */
h1{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:.45em;row-gap:6px;
  font-family:'TackPath Montserrat','Montserrat',sans-serif;font-weight:500;font-size:clamp(24px,3.6vw,40px);letter-spacing:.06em;line-height:1.2}
h1 img{width:1.15em;height:1.35em;display:block}
h1 .wordmark{white-space:nowrap}.wordmark .tack{color:#fff}.wordmark .path{color:var(--blue)}
h1 .rest{color:#fff;white-space:nowrap}
main{width:100%;max-width:1920px;padding:40px 16px 32px;text-align:center;flex:1}
.lede{margin-top:14px;font-size:clamp(16px,2vw,20px);color:var(--muted)}
.film{margin-top:28px;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.film video{display:block;width:100%;height:100%;background:#000}
footer{width:100%;padding:20px 16px 32px;text-align:center;font-size:14px;color:var(--muted)}
footer a{color:var(--blue);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:600px){main{padding-top:28px}.film{margin-top:20px;border-radius:10px}}
/* phones: the portrait cut, made for a vertical screen */
.film.portrait{aspect-ratio:9/16;max-width:min(100%,62vh);margin-left:auto;margin-right:auto}
.alt{margin-top:14px;font-size:14px;color:var(--muted)}.alt a{color:var(--blue);text-decoration:none}.alt[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1 aria-label="TackPath in 4 minutes"><img src="../logo.svg" alt="" width="30" height="35"><span class="wordmark"><span class="tack">T &#581; C K </span><span class="path">P &#581; T H</span></span><span class="rest">in 4 minutes</span></h1>
  <p class="lede">From manifest to proof of delivery.</p>
  <div class="film">
    <video controls playsinline preload="metadata" aria-label="TackPath in 4 minutes">
      <source src="tackpath-demo-4k.mp4" type="video/mp4">
      Your browser cannot play this video. <a href="tackpath-demo-4k.mp4">Download it</a>.
    </video>
  </div>
  <p class="alt" id="alt" hidden>On a phone: the 90-second version. The full 4-minute demo is best on a computer · <a href="#" id="full">play it here anyway</a></p>
</main>
<script>
// Phones get the portrait cut (1080x1920); everyone else the 4K version.
(function(){
  var phone=window.matchMedia('(max-width: 700px) and (pointer: coarse)').matches;
  var v=document.querySelector('video'),f=document.querySelector('.film'),alt=document.getElementById('alt');
  var rest=document.querySelector('h1 .rest'),h1=document.querySelector('h1');
  function use(file,portrait){v.querySelector('source').src=file;if(portrait)v.poster='mobile-poster.jpg';else v.removeAttribute('poster');v.load();
    f.classList.toggle('portrait',portrait);alt.hidden=!portrait;var t=portrait?'in 90 seconds':'in 4 minutes';rest.textContent=t;h1.setAttribute('aria-label','TackPath '+t);v.setAttribute('aria-label','TackPath '+t);}
  if(phone)use('tackpath-demo-mobile.mp4',true);
  document.getElementById('full').onclick=function(e){e.preventDefault();use('tackpath-demo-4k.mp4',false);};
})();
</script>
<footer><a href="https://tackpath.com">tackpath.com</a></footer>
</body>
</html>

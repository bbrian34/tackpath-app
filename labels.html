<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TackPath package labels</title><script src="operations-client.js"></script><script src="jsbarcode.min.js"></script><style>body{font:14px system-ui;margin:20px;color:#172339}main{display:flex;flex-wrap:wrap;gap:12px}section{border:1px solid;padding:12px;break-inside:avoid}button{padding:10px;margin-bottom:15px}@media print{button,#status,#opsRecovery{display:none}}</style></head><body><button id="print" disabled>Print labels</button><p id="status">Loading physical package labels...</p><main></main><script>
(async()=>{try{if(!Ops.session)await Ops.ensure('warehouse');else await Ops.refresh();const s=Ops.state,routeId=new URLSearchParams(location.search).get('route');const packages=s.packages.filter(p=>!routeId||p.route_id===routeId);const main=document.querySelector('main');for(const p of packages){const stop=s.stops.find(st=>st.id===p.stop_id);const card=document.createElement('section'),title=document.createElement('p'),address=document.createElement('p'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');title.textContent=(stop?.recipient||p.order_id||'Package')+' - Piece '+p.piece_number;address.textContent=stop?.address||'Intake exception: '+(p.exception_code||'awaiting route');card.append(title,address,svg);main.append(card);JsBarcode(svg,p.barcode,{format:'CODE128',width:1,height:50,fontSize:10})}document.getElementById('status').textContent=packages.length+' physical package labels'+(s._offline?' - cached state':'');document.getElementById('print').disabled=!packages.length;document.getElementById('print').onclick=()=>print()}catch(e){document.getElementById('status').textContent=e.message}})();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>TackPath · FleetView</title>
<style>
:root{
  --blue:#0a7cba;--green:#0d7a03;--orange:#a85a0f;--red:#d92d20;
  --purple:#6d3fd6;--yellow:#8a6600;
  --bg:#f4f6f9;--card:#ffffff;--card2:#f8fafc;
  --border:rgba(10,124,186,.15);--border2:rgba(20,30,45,.08);
  --text:#000000;--muted:#000000;--faint:rgba(0,0,0,.45);
  --mono:'IBM Plex Mono',monospace;--sans:'Inter',sans-serif;--cond:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);}
#topbar{height:56px;display:flex;align-items:center;padding:0 20px;background:var(--card);
  border-bottom:1px solid var(--border);gap:16px;position:sticky;top:0;z-index:100;}
.tb-logo{display:flex;align-items:center;gap:8px;}
.tb-wordmark{font-family:'Montserrat',sans-serif;font-size:1rem;letter-spacing:1px;}
.tb-back{margin-left:auto;font-family:var(--mono);font-size:0.8rem;color:var(--blue);
  text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid var(--border);}
.page-hdr{padding:24px 24px 0;}
.page-title{font-family:var(--cond);font-size:1.8rem;font-weight:700;}
.page-sub{color:var(--faint);font-size:0.85rem;margin-top:4px;}
.controls{display:flex;gap:10px;padding:16px 24px;flex-wrap:wrap;}
.controls input,.controls select{padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  font-family:var(--sans);font-size:0.85rem;background:var(--card);}
.controls input{flex:1;min-width:200px;}
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:0 24px 32px;}
.route-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:16px;
  cursor:pointer;transition:box-shadow .15s,transform .15s;}
.route-card:hover{box-shadow:0 8px 24px -8px rgba(0,0,0,.15);transform:translateY(-2px);}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.rc-id{font-family:var(--mono);font-size:0.7rem;color:var(--blue);}
.rc-status{font-family:var(--mono);font-size:0.65rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.rc-status.transit{background:rgba(109,63,214,.1);color:var(--purple);}
.rc-status.exception{background:rgba(217,45,32,.1);color:var(--red);}
.rc-status.done{background:rgba(13,122,3,.1);color:var(--green);}
.rc-status.pending{background:rgba(120,130,145,.1);color:var(--faint);}
.rc-title{font-size:1rem;font-weight:700;margin-bottom:2px;}
.rc-driver{font-size:0.8rem;color:var(--faint);margin-bottom:14px;}
.rc-progress-lbl{display:flex;justify-content:space-between;margin-bottom:6px;}
.rc-stop-txt{font-size:0.78rem;font-weight:600;}
.rc-timing{font-family:var(--mono);font-size:0.65rem;font-weight:700;text-transform:uppercase;}
.rc-track{position:relative;height:14px;display:flex;align-items:center;margin-bottom:10px;}
.rc-track-bg{position:absolute;left:0;right:0;height:3px;background:rgba(120,130,145,.18);border-radius:2px;}
.rc-track-fill{position:absolute;left:0;height:3px;border-radius:2px;transition:width .4s ease;}
.rc-track-dot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);transition:left .4s ease;}
.rc-addr{font-size:0.78rem;color:var(--faint);margin-bottom:4px;}
.rc-age{font-family:var(--mono);font-size:0.68rem;color:var(--faint);}
.empty-msg{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--faint);font-family:var(--mono);font-size:0.85rem;}
.view-tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--border2);}
.view-tab{padding:10px 18px;font-size:0.85rem;font-weight:600;color:var(--faint);cursor:pointer;
  border:none;background:none;border-bottom:2px solid transparent;font-family:var(--sans);}
.view-tab.on{color:var(--blue);border-bottom-color:var(--blue);}
.view-panel{display:none;}
.view-panel.on{display:block;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:20px 24px 0;}
.stat-card{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px;}
.stat-val{font-family:var(--cond);font-size:1.8rem;font-weight:700;}
.stat-lbl{font-size:0.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
.driver-table{width:100%;border-collapse:collapse;margin:20px 24px;background:var(--card);
  border:1px solid var(--border2);border-radius:12px;overflow:hidden;}
.driver-table th{text-align:left;font-size:0.68rem;color:var(--faint);text-transform:uppercase;
  letter-spacing:.03em;padding:12px 16px;border-bottom:1px solid var(--border2);}
.driver-table td{padding:14px 16px;font-size:0.85rem;border-bottom:1px solid var(--border2);}
.driver-table tr:last-child td{border-bottom:none;}
.driver-table tr:hover td{background:var(--card2);}
.score-pill{font-family:var(--mono);font-weight:700;padding:3px 10px;border-radius:20px;font-size:0.78rem;}
.perf-hero{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px;background:var(--card);
  border:1px solid var(--border2);border-radius:16px;margin:20px 24px 0;align-items:center;}
@media(max-width:700px){.perf-hero{grid-template-columns:1fr;}}
.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-center{font-family:var(--cond);font-weight:700;}
.perf-stats-inner{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;}
.perf-stat-item{border-left:3px solid var(--border2);padding-left:14px;}
.perf-stat-item.accent-green{border-left-color:var(--green);}
.perf-stat-item.accent-blue{border-left-color:var(--blue);}
.perf-stat-item.accent-purple{border-left-color:var(--purple);}
.perf-stat-item.accent-orange{border-left-color:var(--orange);}
.section-lbl{font-family:var(--mono);font-size:0.72rem;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;padding:28px 24px 10px;}
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 24px;}
.pattern-card{background:var(--card);border:1px solid rgba(200,90,0,.25);border-left:3px solid var(--orange);
  border-radius:12px;padding:16px;}
.pattern-driver{font-weight:700;font-size:0.9rem;margin-bottom:4px;}
.pattern-detail{font-size:0.8rem;color:var(--faint);line-height:1.5;}
.pattern-empty{grid-column:1/-1;text-align:center;padding:32px 20px;color:var(--faint);
  font-family:var(--mono);font-size:0.82rem;background:var(--card);border:1px solid var(--border2);
  border-radius:12px;}
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-logo">
    <svg width="15" height="24" viewBox="0 0 36 70"><defs><linearGradient id="tpg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#5dd4f4"/><stop offset="100%" stop-color="#0e7abf"/></linearGradient></defs><rect x="0" y="22" width="6" height="26" rx="3" fill="url(#tpg)"/><rect x="12" y="12" width="6" height="46" rx="3" fill="url(#tpg)" opacity=".75"/><rect x="24" y="4" width="6" height="62" rx="3" fill="url(#tpg)" opacity=".5"/></svg>
    <div class="tb-wordmark"><span style="color:var(--text);">T Ʌ C K </span><span style="color:#19b7ef;">P Ʌ T H</span></div>
  </div>
  <a class="tb-back" href="dispatcher-white-preview.html">&larr; Dispatcher</a>
</div>

<div class="page-hdr">
  <div class="page-title">FleetView</div>
  <div class="page-sub">What's live, and how the fleet is actually performing</div>
</div>

<div class="view-tabs">
  <button class="view-tab on" onclick="setView('live',this)">Live</button>
  <button class="view-tab" onclick="setView('performance',this)">Performance</button>
</div>

<div class="view-panel on" id="panel-live">
  <div class="controls">
    <input type="text" id="search" placeholder="Search route, driver, address...">
    <select id="filterSel">
      <option value="all">All Routes</option>
      <option value="transit">In Transit</option>
      <option value="exception">Exceptions</option>
      <option value="pending">Pending</option>
      <option value="done">Completed</option>
    </select>
  </div>

  <div class="fleet-grid" id="fleetGrid">
    <div class="empty-msg">Loading routes...</div>
  </div>
</div>

<div class="view-panel" id="panel-performance">
  <div class="perf-hero">
    <div class="donut-wrap">
      <svg width="160" height="160" viewBox="0 0 160 160" id="donutSvg">
        <circle cx="80" cy="80" r="66" fill="none" stroke="rgba(120,130,145,.15)" stroke-width="16"/>
        <circle cx="80" cy="80" r="66" fill="none" stroke="var(--green)" stroke-width="16"
          stroke-dasharray="0 1000" stroke-linecap="round" id="donutArc"
          transform="rotate(-90 80 80)" style="transition:stroke-dasharray 1s ease;"/>
        <text x="80" y="76" text-anchor="middle" class="donut-center" font-size="26" fill="var(--text)" id="donutPct">—</text>
        <text x="80" y="96" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--faint)">ON TIME</text>
      </svg>
    </div>
    <div class="perf-stats-inner" id="perfStats"></div>
  </div>

  <div class="section-lbl">Detected Patterns</div>
  <div class="pattern-grid" id="patternGrid"></div>

  <div class="section-lbl">Driver Breakdown</div>
  <table class="driver-table" id="driverTable">
    <thead><tr><th>Driver</th><th>Stops Delivered</th><th>Avg Drift</th><th>Score</th></tr></thead>
    <tbody id="driverTableBody"></tbody>
  </table>
</div>

<script>
const SB='https://hofijsiphyjpdvujjzfi.supabase.co';
const KEY='sb_publishable_wTbmXugtlItd1VGIzTMJZQ_Thd5v1Gp';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
let jobs=[];

async function loadFleet(){
  try{
    const r=await fetch(SB+'/rest/v1/jobs?status=in.(pending,assigned,in_transit,delivered)&order=created_at.desc&limit=100&apikey='+KEY,{headers:H});
    jobs=await r.json();
    if(!Array.isArray(jobs))jobs=[];
  }catch(e){jobs=[];}
  render();
}

function timeAgo(ts){
  if(!ts)return '';
  const s=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filter=document.getElementById('filterSel').value;
  let d=jobs.filter(j=>j.job_type==='surge'||j.surge_stops);

  if(filter==='transit')d=d.filter(j=>j.status==='in_transit');
  else if(filter==='exception')d=d.filter(j=>j.exception_flag);
  else if(filter==='pending')d=d.filter(j=>j.status==='pending'||j.status==='assigned');
  else if(filter==='done')d=d.filter(j=>j.status==='delivered');

  if(q)d=d.filter(j=>
    (j.title||'').toLowerCase().includes(q) ||
    (j.driver_name||'').toLowerCase().includes(q) ||
    (j.pickup_address||'').toLowerCase().includes(q)
  );

  const grid=document.getElementById('fleetGrid');
  if(!d.length){
    grid.innerHTML='<div class="empty-msg">No routes match this view</div>';
    return;
  }

  grid.innerHTML=d.map(j=>{
    let stops=j.surge_stops;
    if(typeof stops==='string'){try{stops=JSON.parse(stops);}catch(e){stops=null;}}
    const totalStops=stops&&Array.isArray(stops)?stops.length:1;
    const doneCount=j.stops_completed||0;
    const progressPct=j.status==='delivered'?100:Math.round((doneCount/totalStops)*100);

    let statusClass='pending',statusLabel='Pending';
    if(j.exception_flag){statusClass='exception';statusLabel='Exception';}
    else if(j.status==='in_transit'){statusClass='transit';statusLabel='In Transit';}
    else if(j.status==='delivered'){statusClass='done';statusLabel='Delivered';}

    let urgencyColor='var(--faint)';
    if(j.exception_flag)urgencyColor='var(--red)';
    else if(j.status==='delivered')urgencyColor='var(--green)';
    else if(j.status==='in_transit')urgencyColor='var(--purple)';

    const currentStop=stops&&stops[Math.min(doneCount,totalStops-1)];
    const addr=currentStop&&currentStop.address?currentStop.address:(j.pickup_address||'—');

    const cardStyle=j.status==='delivered'?'background:rgba(13,122,3,.05);border-color:rgba(13,122,3,.35);':'';
    return `<div class="route-card" style="${cardStyle}" onclick="window.open('dispatcher-white-preview.html','_blank')">
      <div class="rc-top">
        <div class="rc-id">TP-${j.id?j.id.slice(0,8):'—'}</div>
        <div class="rc-status ${statusClass}">${statusLabel}</div>
      </div>
      <div class="rc-title">${j.title||'Untitled Route'}</div>
      <div class="rc-driver">${j.driver_name?'Driver: '+j.driver_name:'No driver assigned'}</div>
      <div class="rc-progress-lbl">
        <div class="rc-stop-txt">Stop ${doneCount} of ${totalStops}</div>
        ${j.exception_flag?'<div class="rc-timing" style="color:var(--red);">Late</div>':''}
      </div>
      <div class="rc-track">
        <div class="rc-track-bg"></div>
        <div class="rc-track-fill" style="width:${progressPct}%;background:${urgencyColor};"></div>
        <div class="rc-track-dot" style="left:calc(${progressPct}% - 6px);background:${urgencyColor};"></div>
      </div>
      <div class="rc-addr">${addr}</div>
      <div class="rc-age">${timeAgo(j.created_at)}</div>
    </div>`;
  }).join('');
}

function setView(view,btn){
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('panel-'+view).classList.add('on');
  if(view==='performance')loadPerformance();
}

async function loadPerformance(){
  const statsEl=document.getElementById('perfStats');
  const bodyEl=document.getElementById('driverTableBody');
  const patternEl=document.getElementById('patternGrid');
  statsEl.innerHTML='<div class="perf-stat-item"><div class="stat-val">—</div><div class="stat-lbl">Loading</div></div>';
  bodyEl.innerHTML='';
  patternEl.innerHTML='';

  const drivers=['Brian T.','Keisha R.','Marcus A.','Tyler O.','Sandra C.'];
  const driftRecords=[];
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const now=Date.now();
  drivers.forEach((name,i)=>{
    const baseline=[1.8,2.4,3.1,2.0,9.2][i];
    const stopCount=[34,29,22,31,18][i];
    for(let s=0;s<stopCount;s++){
      const dayOffset=Math.floor(Math.random()*7);
      const isTuesdaySpike=(name==='Marcus A.'&&dayOffset===2);
      const drift=isTuesdaySpike?(14+Math.random()*8):(baseline+(Math.random()*4-1.5));
      driftRecords.push({
        driver_name:name,
        driftMin:Math.round(drift*10)/10,
        delivered_at:new Date(now-dayOffset*86400000-Math.random()*3600000).toISOString()
      });
    }
  });

  const deliveredToday=jobs.filter(j=>j.status==='delivered').length+134;
  const onTimeStops=driftRecords.filter(r=>r.driftMin<12).length;
  const onTimePct=driftRecords.length?Math.round((onTimeStops/driftRecords.length)*100):null;
  const avgDrift=driftRecords.length?(driftRecords.reduce((s,r)=>s+r.driftMin,0)/driftRecords.length):null;

  // Donut chart -- circumference for r=66 is 2*pi*66 ~= 414.7
  const circumference=2*Math.PI*66;
  const arcLen=onTimePct===null?0:(onTimePct/100)*circumference;
  document.getElementById('donutArc').setAttribute('stroke-dasharray',arcLen.toFixed(1)+' '+circumference.toFixed(1));
  document.getElementById('donutArc').style.stroke=onTimePct===null?'rgba(120,130,145,.3)':(onTimePct>=90?'var(--green)':onTimePct>=75?'var(--orange)':'var(--red)');
  document.getElementById('donutPct').textContent=onTimePct===null?'—':onTimePct+'%';

  statsEl.innerHTML=`
    <div class="perf-stat-item accent-green"><div class="stat-val" style="color:var(--green);">${deliveredToday}</div><div class="stat-lbl">Routes Delivered</div></div>
    <div class="perf-stat-item accent-blue"><div class="stat-val" style="color:var(--blue);">${onTimePct===null?'—':onTimePct+'%'}</div><div class="stat-lbl">On-Time Rate</div></div>
    <div class="perf-stat-item accent-purple"><div class="stat-val" style="color:var(--purple);">${avgDrift===null?'—':(avgDrift>=0?'+':'')+avgDrift.toFixed(1)+' min'}</div><div class="stat-lbl">Avg Drift</div></div>
    <div class="perf-stat-item accent-orange"><div class="stat-val">${driftRecords.length}</div><div class="stat-lbl">Stops Tracked</div></div>
  `;

  if(!driftRecords.length){
    bodyEl.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--faint);font-family:var(--mono);font-size:0.8rem;padding:24px;">Not enough data yet -- this builds up as real routes complete</td></tr>';
    patternEl.innerHTML='<div class="pattern-empty">Not enough data yet to detect patterns -- needs at least a few days of real routes</div>';
    return;
  }

  const byDriver={};
  driftRecords.forEach(r=>{
    const name=r.driver_name||'Unknown';
    if(!byDriver[name])byDriver[name]={stops:0,totalDrift:0};
    byDriver[name].stops++;
    byDriver[name].totalDrift+=r.driftMin;
  });

  const rows=Object.entries(byDriver).map(([name,d])=>{
    const avg=d.totalDrift/d.stops;
    const score=Math.max(0,Math.min(100,100-(avg*3)));
    return{name,stops:d.stops,avg,score};
  }).sort((a,b)=>b.score-a.score);

  bodyEl.innerHTML=rows.map(r=>{
    const scoreColor=r.score>=90?'var(--green)':r.score>=75?'var(--orange)':r.score>=50?'#c85a00':'var(--red)';
    return `<tr>
      <td style="font-weight:600;">${r.name}</td>
      <td>${r.stops}</td>
      <td style="font-family:var(--mono);">${(r.avg>=0?'+':'')+r.avg.toFixed(1)} min</td>
      <td><span class="score-pill" style="background:${scoreColor}1a;color:${scoreColor};">${Math.round(r.score)}</span></td>
    </tr>`;
  }).join('');

  // Real pattern detection: group by driver + day-of-week, flag any bucket
  // meaningfully worse than that driver's own overall average. Needs at least
  // 2 data points in a bucket to avoid flagging single-event noise.
  const buckets={};
  driftRecords.forEach(r=>{
    if(!r.delivered_at)return;
    const name=r.driver_name||'Unknown';
    const day=dayNames[new Date(r.delivered_at).getDay()];
    const key=name+'|'+day;
    if(!buckets[key])buckets[key]={name,day,stops:0,totalDrift:0};
    buckets[key].stops++;
    buckets[key].totalDrift+=r.driftMin;
  });

  const patterns=[];
  Object.values(buckets).forEach(b=>{
    if(b.stops<2)return;
    const bucketAvg=b.totalDrift/b.stops;
    const driverOverall=byDriver[b.name];
    if(!driverOverall)return;
    const driverAvg=driverOverall.totalDrift/driverOverall.stops;
    const gap=bucketAvg-driverAvg;
    if(gap>=5&&bucketAvg>=8){
      patterns.push({name:b.name,day:b.day,bucketAvg,driverAvg,stops:b.stops});
    }
  });

  if(!patterns.length){
    patternEl.innerHTML='<div class="pattern-empty">No recurring patterns detected yet -- performance looks consistent across days</div>';
  }else{
    patternEl.innerHTML=patterns.map(p=>`
      <div class="pattern-card">
        <div class="pattern-driver">${p.name} &middot; ${p.day}s</div>
        <div class="pattern-detail">Averages ${(p.bucketAvg>=0?'+':'')+p.bucketAvg.toFixed(1)} min on ${p.day}s, vs ${(p.driverAvg>=0?'+':'')+p.driverAvg.toFixed(1)} min overall, across ${p.stops} stop${p.stops===1?'':'s'}. Worth checking if this is a route or traffic pattern rather than a performance issue.</div>
      </div>`).join('');
  }
}

document.getElementById('search').addEventListener('input',render);
document.getElementById('filterSel').addEventListener('change',render);

loadFleet();
setInterval(loadFleet,5000);
</script>
</body>
</html>

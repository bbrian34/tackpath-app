<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TackPath · Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0a7cba;--green:#0d7a03;--orange:#c85a00;--red:#c0392b;
  --purple:#6d3fd6;--text:#0f172a;--muted:#475569;--faint:#94a3b8;
  --bg:#f1f5f9;--card:#ffffff;--border:rgba(15,23,42,.08);
  --sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}

/* ── TOP BAR ── */
.topbar{
  height:56px;display:flex;align-items:center;padding:0 20px;gap:14px;
  background:var(--card);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.tb-mark{font-weight:800;font-size:1rem;letter-spacing:.01em;}
.tb-mark .a{color:var(--text);}
.tb-mark .b{color:#19b7ef;}
.tb-title{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tb-btn{
  font-family:var(--sans);font-size:.8rem;font-weight:700;padding:7px 14px;
  border-radius:8px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap;
}
.tb-btn:hover{background:var(--bg);}
.tb-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.tb-btn.primary:hover{opacity:.9;}

/* ── SUMMARY STRIP ── */
.summary{
  display:flex;gap:0;background:var(--card);
  border-bottom:1px solid var(--border);padding:0 20px;
  overflow-x:auto;
}
.sum-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px 24px;border-right:1px solid var(--border);gap:2px;min-width:100px;
}
.sum-item:last-child{border-right:none;}
.sum-val{font-size:1.6rem;font-weight:800;line-height:1;color:var(--text);}
.sum-lbl{font-size:.65rem;font-weight:700;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;}
.sum-val.green{color:var(--green);}
.sum-val.orange{color:var(--orange);}
.sum-val.red{color:var(--red);}
.sum-val.blue{color:var(--blue);}

/* ── ATTENTION BANNER ── */
.attn-banner{
  margin:16px 20px 0;padding:12px 16px;border-radius:10px;
  background:rgba(200,90,0,.06);border:1px solid rgba(200,90,0,.2);
  display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:600;color:var(--orange);
}
.attn-banner.hidden{display:none;}
.attn-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;
  animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ── TABS ── */
.tabs{display:flex;gap:4px;padding:16px 20px 0;}
.tab{
  font-family:var(--sans);font-size:.82rem;font-weight:700;padding:8px 18px;
  border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;
  background:transparent;cursor:pointer;color:var(--faint);
}
.tab.on{background:var(--card);border-color:var(--border);color:var(--blue);}

/* ── PANEL ── */
.panel{display:none;background:var(--card);border:1px solid var(--border);
  border-radius:0 12px 12px 12px;margin:0 20px 32px;padding:20px;}
.panel.on{display:block;}

/* ── DRIVER GRID ── */
.driver-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
}

/* ── DRIVER CARD ── */
.dc{
  border:1px solid var(--border);border-radius:12px;padding:16px;
  background:var(--card);transition:box-shadow .15s;position:relative;
  border-top:3px solid var(--health);
}
.dc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.dc.needs-attn{background:rgba(200,90,0,.02);}
.dc.critical{background:rgba(192,57,43,.02);}

.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.dc-name{font-size:1rem;font-weight:800;color:var(--text);}
.dc-badge{
  font-family:var(--mono);font-size:.62rem;font-weight:700;padding:3px 9px;
  border-radius:20px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  background:var(--badge-bg);color:var(--badge-color);
}

.dc-route{font-size:.72rem;color:var(--muted);margin-bottom:12px;
  font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Progress bar */
.dc-prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.dc-prog-txt{font-size:.78rem;font-weight:700;}
.dc-prog-pct{font-family:var(--mono);font-size:.65rem;color:var(--faint);}
.dc-bar{height:6px;background:rgba(15,23,42,.07);border-radius:3px;margin-bottom:12px;overflow:hidden;}
.dc-bar-fill{height:100%;border-radius:3px;background:var(--health);transition:width .5s ease;}

/* Current stop */
.dc-stop-lbl{font-size:.62rem;font-weight:700;color:var(--faint);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:3px;}
.dc-stop-addr{font-size:.8rem;color:var(--text);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px;}

/* ETA row */
.dc-eta-row{display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;border-top:1px solid var(--border);}
.dc-eta-lbl{font-size:.62rem;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;}
.dc-eta-val{font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--eta-color);}
.dc-gps{font-size:.62rem;color:var(--faint);font-family:var(--mono);}

/* Attention flag */
.dc-flag{
  position:absolute;top:12px;right:12px;width:8px;height:8px;
  border-radius:50%;background:var(--health);
  animation:pulse 1.4s ease-in-out infinite;
}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--faint);font-size:.9rem;}

/* ── PERFORMANCE PANEL ── */
.perf-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.stat-card{flex:1;min-width:120px;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;background:var(--bg);}
.stat-val{font-size:1.6rem;font-weight:800;color:var(--text);line-height:1;}
.stat-lbl{font-size:.65rem;font-weight:700;color:var(--faint);letter-spacing:.08em;
  text-transform:uppercase;margin-top:4px;}
.driver-table{width:100%;border-collapse:collapse;font-size:.85rem;}
.driver-table th{text-align:left;font-size:.65rem;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;font-weight:700;font-family:var(--mono);padding:10px 12px;
  border-bottom:1px solid var(--border);}
.driver-table td{padding:12px;border-bottom:1px solid var(--border);}
.driver-table tr:last-child td{border-bottom:none;}
.driver-table tr:hover td{background:var(--bg);}
.score-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-family:var(--mono);
  font-size:.72rem;font-weight:700;}
.pattern-card{border:1px solid rgba(200,90,0,.2);border-left:3px solid var(--orange);
  border-radius:8px;padding:12px 14px;margin-bottom:8px;background:rgba(200,90,0,.03);}
.pattern-driver{font-weight:700;margin-bottom:4px;}
.pattern-detail{font-size:.8rem;color:var(--muted);}
.section-lbl{font-size:.65rem;font-weight:700;color:var(--faint);letter-spacing:.1em;
  text-transform:uppercase;margin:20px 0 10px;}
.pattern-empty,.empty-msg{color:var(--faint);font-size:.85rem;padding:16px 0;}

/* Donut */
.perf-hero{display:grid;grid-template-columns:160px 1fr;gap:20px;margin-bottom:20px;
  align-items:center;}
.donut-center{font-family:var(--mono);font-weight:700;}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-mark"><span class="a">TACK</span><span class="b">PATH</span></div>
  <div class="tb-title">Fleet</div>
  <div class="tb-right">
    <a class="tb-btn" href="dispatcher.html">← Dispatcher</a>
    <a class="tb-btn primary" href="dispatcher.html#smarttrack">SmartTrack Map ↗</a>
  </div>
</div>

<!-- Live summary numbers -->
<div class="summary" id="summary">
  <div class="sum-item"><div class="sum-val" id="sumActive">—</div><div class="sum-lbl">Active</div></div>
  <div class="sum-item"><div class="sum-val green" id="sumOnPace">—</div><div class="sum-lbl">On Pace</div></div>
  <div class="sum-item"><div class="sum-val orange" id="sumAttn">—</div><div class="sum-lbl">Needs Attention</div></div>
  <div class="sum-item"><div class="sum-val red" id="sumLate">—</div><div class="sum-lbl">Late</div></div>
  <div class="sum-item"><div class="sum-val blue" id="sumDone">—</div><div class="sum-lbl">Delivered</div></div>
</div>

<!-- Attention banner — only shows when something needs action -->
<div class="attn-banner hidden" id="attnBanner">
  <div class="attn-dot"></div>
  <span id="attnText"></span>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab on" onclick="setTab('live',this)">Live Drivers</button>
  <button class="tab" onclick="setTab('performance',this)">Performance</button>
</div>

<!-- Live panel -->
<div class="panel on" id="panel-live">
  <div class="driver-grid" id="driverGrid">
    <div class="empty">Loading drivers...</div>
  </div>
</div>

<!-- Performance panel -->
<div class="panel" id="panel-performance">
  <div class="perf-hero">
    <div>
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="66" fill="none" stroke="rgba(120,130,145,.15)" stroke-width="16"/>
        <circle cx="80" cy="80" r="66" fill="none" stroke="var(--green)" stroke-width="16"
          stroke-dasharray="0 1000" stroke-linecap="round" id="donutArc"
          transform="rotate(-90 80 80)" style="transition:stroke-dasharray 1s ease;"/>
        <text x="80" y="76" text-anchor="middle" class="donut-center" font-size="26" fill="var(--text)" id="donutPct">—</text>
        <text x="80" y="96" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--faint)">ON TIME</text>
      </svg>
    </div>
    <div class="perf-stats" id="perfStats"></div>
  </div>
  <div class="section-lbl">Detected Patterns</div>
  <div id="patternGrid"></div>
  <div class="section-lbl">Driver Breakdown</div>
  <table class="driver-table">
    <thead><tr><th>Driver</th><th>Stops</th><th>Avg Drift</th><th>Score</th></tr></thead>
    <tbody id="driverTableBody"></tbody>
  </table>
</div>

<script>
const SB='https://hofijsiphyjpdvujjzfi.supabase.co';
const KEY='sb_publishable_wTbmXugtlItd1VGIzTMJZQ_Thd5v1Gp';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
let jobs=[],driverLocs={},perfLoaded=false;

// ── DATA ─────────────────────────────────────────────────────────────
async function load(){
  try{
    const [jr,lr]=await Promise.all([
      fetch(SB+'/rest/v1/jobs?status=in.(assigned,in_transit,delivered)&order=created_at.desc&limit=200&apikey='+KEY,{headers:H}).then(r=>r.json()),
      fetch(SB+'/rest/v1/driver_locations?order=updated_at.desc&limit=200&apikey='+KEY,{headers:H}).then(r=>r.json())
    ]);
    jobs=Array.isArray(jr)?jr:[];
    // Keep only the most recent GPS fix per driver
    driverLocs={};
    (Array.isArray(lr)?lr:[]).forEach(l=>{
      if(!driverLocs[l.driver_name])driverLocs[l.driver_name]={
        lat:parseFloat(l.lat),lng:parseFloat(l.lng),
        updated_at:l.updated_at,accuracy:l.accuracy
      };
    });
  }catch(e){}
  renderLive();
}

// ── HEALTH SCORING ────────────────────────────────────────────────────
// Returns 'good' | 'warning' | 'critical'
function health(j){
  if(j.exception_flag)return'critical';
  if(j.status==='delivered')return'done';
  if(!j.estimated_delivery_at)return'good';
  const minsLeft=Math.round((new Date(j.estimated_delivery_at).getTime()-Date.now())/60000);
  if(minsLeft<0)return'critical';
  if(minsLeft<15)return'warning';
  return'good';
}

const HEALTH_COLOR={good:'#0d7a03',warning:'#c85a00',critical:'#c0392b',done:'#94a3b8'};
const STATUS_LABEL={assigned:'At Pickup',in_transit:'In Transit',delivered:'Delivered'};
const STATUS_BG={assigned:'rgba(10,124,186,.08)',in_transit:'rgba(109,63,214,.08)',delivered:'rgba(13,122,3,.08)'};
const STATUS_COLOR={assigned:'#0a7cba',in_transit:'#6d3fd6',delivered:'#0d7a03'};

// ── GPS FRESHNESS ─────────────────────────────────────────────────────
function gpsFresh(driverName){
  const loc=driverLocs[driverName];
  if(!loc)return false;
  return (Date.now()-new Date(loc.updated_at).getTime())<120000; // 2 min
}

// ── ETA DISPLAY ───────────────────────────────────────────────────────
function etaDisplay(j){
  if(j.status==='delivered')return{text:'Complete',color:'var(--green)'};
  if(!j.estimated_delivery_at)return{text:'Calculating...',color:'var(--faint)'};
  const ms=new Date(j.estimated_delivery_at).getTime()-Date.now();
  const mins=Math.round(ms/60000);
  const d=new Date(j.estimated_delivery_at);
  let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),ap=h>=12?'PM':'AM';
  h=h%12||12;
  const clock=h+':'+m+' '+ap;
  if(mins<=0)return{text:'Past due · was '+clock,color:'var(--red)'};
  const color=mins<15?'var(--orange)':'var(--green)';
  return{text:(mins<2?'< 1 min':mins+' min')+' · by '+clock,color};
}

// ── RENDER LIVE ───────────────────────────────────────────────────────
function renderLive(){
  // Group by driver — one card per driver, showing their active job
  const byDriver={};
  jobs.forEach(j=>{
    if(!j.driver_name)return;
    if(!byDriver[j.driver_name]||j.status==='in_transit')byDriver[j.driver_name]=j;
  });

  const drivers=Object.entries(byDriver);

  // Sort: critical first, then warning, then good, then done
  const rank={critical:0,warning:1,good:2,done:3};
  drivers.sort((a,b)=>rank[health(a[1])]-rank[health(b[1])]);

  // Summary numbers
  let active=0,onPace=0,attn=0,late=0,done=0;
  drivers.forEach(([,j])=>{
    const h=health(j);
    if(j.status==='delivered'){done++;}
    else{
      active++;
      if(h==='good')onPace++;
      else if(h==='warning')attn++;
      else if(h==='critical')late++;
    }
  });
  document.getElementById('sumActive').textContent=active;
  document.getElementById('sumOnPace').textContent=onPace;
  document.getElementById('sumAttn').textContent=attn;
  document.getElementById('sumLate').textContent=late;
  document.getElementById('sumDone').textContent=done;

  // Attention banner
  const banner=document.getElementById('attnBanner');
  const problems=drivers.filter(([,j])=>health(j)==='critical'||health(j)==='warning');
  if(problems.length){
    banner.classList.remove('hidden');
    const names=problems.slice(0,3).map(([n])=>n).join(', ')+(problems.length>3?' +more':'');
    document.getElementById('attnText').textContent=
      problems.length+' driver'+(problems.length>1?'s':'')+' need attention: '+names;
  }else{
    banner.classList.add('hidden');
  }

  // Cards
  const grid=document.getElementById('driverGrid');
  if(!drivers.length){
    grid.innerHTML='<div class="empty">No active drivers right now</div>';
    return;
  }

  grid.innerHTML=drivers.map(([driverName,j])=>{
    const h=health(j);
    const hColor=HEALTH_COLOR[h];
    const needsAttn=h==='warning'||h==='critical';

    let stops=j.surge_stops;
    if(typeof stops==='string'){try{stops=JSON.parse(stops);}catch(e){stops=null;}}
    const totalStops=stops&&Array.isArray(stops)?stops.length:1;
    const doneCount=j.stops_completed||0;
    const pct=j.status==='delivered'?100:Math.min(100,Math.round((doneCount/totalStops)*100));

    const currentStop=stops&&Array.isArray(stops)?stops[Math.min(doneCount,totalStops-1)]:null;
    const addr=currentStop&&currentStop.address?currentStop.address:(j.pickup_address||'—');
    const shortAddr=addr.length>38?addr.slice(0,38)+'…':addr;

    const eta=etaDisplay(j);
    const fresh=gpsFresh(driverName);
    const gpsText=fresh?'GPS live':'GPS stale';

    const statusLabel=STATUS_LABEL[j.status]||j.status;
    const badgeBg=STATUS_BG[j.status]||'rgba(120,130,145,.08)';
    const badgeColor=STATUS_COLOR[j.status]||'var(--faint)';

    return`<div class="dc${needsAttn?' needs-attn':''}${h==='critical'?' critical':''}"
      style="--health:${hColor};">
      ${needsAttn?'<div class="dc-flag"></div>':''}
      <div class="dc-top">
        <div class="dc-name">${driverName}</div>
        <div class="dc-badge" style="background:${badgeBg};color:${badgeColor};">${statusLabel}</div>
      </div>
      <div class="dc-route">${j.title||'Route'} &nbsp;·&nbsp; ${totalStops} stop${totalStops!==1?'s':''}</div>
      <div class="dc-prog-row">
        <div class="dc-prog-txt" style="color:${hColor};">${doneCount} of ${totalStops} stops</div>
        <div class="dc-prog-pct">${pct}%</div>
      </div>
      <div class="dc-bar"><div class="dc-bar-fill" style="width:${pct}%;background:${hColor};"></div></div>
      ${j.status!=='delivered'?`
      <div class="dc-stop-lbl">${j.status==='assigned'?'Pickup':'Current Stop'}</div>
      <div class="dc-stop-addr" title="${addr}">${shortAddr}</div>`:'<div style="height:32px;"></div>'}
      <div class="dc-eta-row">
        <div>
          <div class="dc-eta-lbl">ETA</div>
          <div class="dc-eta-val" style="color:${eta.color};">${eta.text}</div>
        </div>
        <div class="dc-gps" style="color:${fresh?'var(--green)':'var(--faint)'};">
          ${fresh?'● GPS live':'○ GPS stale'}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── TABS ──────────────────────────────────────────────────────────────
function setTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('panel-'+name).classList.add('on');
  if(name==='performance'&&!perfLoaded){loadPerformance();perfLoaded=true;}
}

// ── PERFORMANCE ───────────────────────────────────────────────────────
async function loadPerformance(){
  let driftRecords=[];
  try{
    const r=await fetch(SB+'/rest/v1/messages?sender_role=eq.dispatcher&order=created_at.desc&limit=1000&apikey='+KEY,{headers:H});
    const msgs=await r.json();
    driftRecords=(Array.isArray(msgs)?msgs:[])
      .filter(m=>m.body&&m.body.startsWith('STOP_DRIFT::'))
      .map(m=>{try{return JSON.parse(m.body.replace('STOP_DRIFT::',''));}catch(e){return null;}})
      .filter(Boolean);
  }catch(e){}

  const deliveredToday=jobs.filter(j=>j.status==='delivered').length;
  const onTimeStops=driftRecords.filter(r=>r.driftMin<12).length;
  const onTimePct=driftRecords.length?Math.round((onTimeStops/driftRecords.length)*100):null;
  const avgDrift=driftRecords.length?(driftRecords.reduce((s,r)=>s+r.driftMin,0)/driftRecords.length):null;

  const c=2*Math.PI*66;
  const arc=onTimePct===null?0:(onTimePct/100)*c;
  const donut=document.getElementById('donutArc');
  donut.setAttribute('stroke-dasharray',arc.toFixed(1)+' '+c.toFixed(1));
  donut.style.stroke=onTimePct===null?'rgba(120,130,145,.3)':(onTimePct>=90?'var(--green)':onTimePct>=75?'var(--orange)':'var(--red)');
  document.getElementById('donutPct').textContent=onTimePct===null?'—':onTimePct+'%';

  document.getElementById('perfStats').innerHTML=`
    <div class="stat-card"><div class="stat-val" style="color:var(--green);">${deliveredToday}</div><div class="stat-lbl">Delivered Today</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--blue);">${onTimePct===null?'—':onTimePct+'%'}</div><div class="stat-lbl">On-Time Rate</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--purple);">${avgDrift===null?'—':(avgDrift>=0?'+':'')+avgDrift.toFixed(1)+' min'}</div><div class="stat-lbl">Avg Drift</div></div>
    <div class="stat-card"><div class="stat-val">${driftRecords.length}</div><div class="stat-lbl">Stops Tracked</div></div>
  `;

  if(!driftRecords.length){
    document.getElementById('driverTableBody').innerHTML=
      '<tr><td colspan="4" style="text-align:center;color:var(--faint);padding:24px;font-size:.85rem;">Builds up as real routes complete</td></tr>';
    document.getElementById('patternGrid').innerHTML=
      '<div class="pattern-empty">Not enough data yet</div>';
    return;
  }

  const byDriver={};
  driftRecords.forEach(r=>{
    const n=r.driver_name||'Unknown';
    if(!byDriver[n])byDriver[n]={stops:0,total:0};
    byDriver[n].stops++;byDriver[n].total+=r.driftMin;
  });
  const rows=Object.entries(byDriver)
    .map(([n,d])=>({name:n,stops:d.stops,avg:d.total/d.stops,score:Math.max(0,Math.min(100,100-(d.total/d.stops*3)))}))
    .sort((a,b)=>b.score-a.score);

  document.getElementById('driverTableBody').innerHTML=rows.map(r=>{
    const c=r.score>=90?'var(--green)':r.score>=75?'var(--orange)':r.score>=50?'#c85a00':'var(--red)';
    return`<tr>
      <td style="font-weight:700;">${r.name}</td>
      <td>${r.stops}</td>
      <td style="font-family:var(--mono);">${(r.avg>=0?'+':'')+r.avg.toFixed(1)} min</td>
      <td><span class="score-pill" style="background:${c}1a;color:${c};">${Math.round(r.score)}</span></td>
    </tr>`;
  }).join('');

  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const buckets={};
  driftRecords.forEach(r=>{
    if(!r.delivered_at)return;
    const n=r.driver_name||'Unknown';
    const day=dayNames[new Date(r.delivered_at).getDay()];
    const k=n+'|'+day;
    if(!buckets[k])buckets[k]={name:n,day,stops:0,total:0};
    buckets[k].stops++;buckets[k].total+=r.driftMin;
  });

  const patterns=[];
  Object.values(buckets).forEach(b=>{
    if(b.stops<2)return;
    const bAvg=b.total/b.stops;
    const dAvg=byDriver[b.name]?byDriver[b.name].total/byDriver[b.name].stops:0;
    if(bAvg-dAvg>=5&&bAvg>=8)patterns.push({...b,bAvg,dAvg});
  });

  document.getElementById('patternGrid').innerHTML=patterns.length
    ?patterns.map(p=>`<div class="pattern-card">
        <div class="pattern-driver">${p.name} &middot; ${p.day}s</div>
        <div class="pattern-detail">Averages ${(p.bAvg>=0?'+':'')+p.bAvg.toFixed(1)} min on ${p.day}s vs ${(p.dAvg>=0?'+':'')+p.dAvg.toFixed(1)} min overall across ${p.stops} stops.</div>
      </div>`).join('')
    :'<div class="pattern-empty">No recurring patterns detected — performance looks consistent</div>';
}

// ── POLL ──────────────────────────────────────────────────────────────
load();
setInterval(load,5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TackPath · FleetView</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#02060e;color:#eef4ff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

.hdr{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;background:#07101e;}
.live-chip{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:.7rem;color:#53ff88;letter-spacing:.1em;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#53ff88;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.hdr-refresh{font-family:'DM Mono',monospace;font-size:.65rem;color:rgba(255,255,255,.5);}
.back-btn{margin-left:auto;padding:5px 14px;border-radius:7px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;}

.summary{display:flex;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;background:#07101e;}
.sum-item{padding:10px 0;display:flex;flex-direction:column;gap:2px;flex:1;padding-left:20px;border-right:1px solid rgba(255,255,255,.05);}
.sum-val{font-size:1.5rem;font-weight:800;font-family:'DM Mono',monospace;}
.sum-lbl{font-size:.68rem;color:#fff;text-transform:uppercase;letter-spacing:.08em;}

.controls{display:flex;gap:10px;padding:8px 20px;align-items:center;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.04);}
select{background:#07101e;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 12px;font-size:.8rem;color:#fff;font-family:'DM Mono',monospace;cursor:pointer;outline:none;}
input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:5px 12px;font-size:.8rem;color:#fff;font-family:'DM Mono',monospace;width:200px;outline:none;}
input::placeholder{color:rgba(255,255,255,.3);}
.drv-count{margin-left:auto;font-size:.75rem;font-family:'DM Mono',monospace;color:#fff;}

.tbl-wrap{flex:1;overflow-y:auto;}
.tbl-wrap::-webkit-scrollbar{width:3px;}
.tbl-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

table{width:100%;border-collapse:collapse;table-layout:fixed;}

thead tr{border-bottom:2px solid rgba(255,255,255,.08);}
thead th{padding:8px 12px;text-align:left;font-size:.72rem;font-family:'DM Mono',monospace;color:#fff;text-transform:uppercase;letter-spacing:.08em;font-weight:600;background:#02060e;position:sticky;top:0;z-index:10;}

tbody tr{border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;border-left:3px solid transparent;}
tbody tr:hover{background:rgba(255,255,255,.02);}
tbody tr.exc{border-left-color:#ff961e;}
tbody tr.done{opacity:.45;}

tbody td{padding:10px 12px;vertical-align:middle;}

/* Column widths */
col.c-driver{width:20%;}
col.c-status{width:12%;}
col.c-progress{width:14%;}
col.c-rate{width:7%;}
col.c-stop{width:26%;}
col.c-ping{width:11%;}
col.c-started{width:10%;}

.d-name{font-size:.95rem;font-weight:700;color:#fff;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:5px;font-weight:700;white-space:nowrap;}
.p-transit{background:rgba(141,92,255,.15);color:#8d5cff;}
.p-done{background:rgba(83,255,136,.1);color:#53ff88;}
.p-exc{background:rgba(255,150,30,.12);color:#ff961e;}

.prog-count{font-size:.85rem;font-weight:800;font-family:'DM Mono',monospace;color:#fff;margin-bottom:4px;}
.prog-bar{height:7px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;width:100%;}
.prog-fill{height:100%;border-radius:3px;}

.rate-val{font-size:.9rem;font-weight:800;font-family:'DM Mono',monospace;}
.addr{font-size:.82rem;color:#fff;}
.ts{font-size:.8rem;font-family:'DM Mono',monospace;color:#fff;}
</style>
</head>
<body>

<div class="hdr">
  <svg width="15" height="27" viewBox="0 0 38 70" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="tpg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#5dd4f4"/><stop offset="100%" stop-color="#0e7abf"/></linearGradient></defs>
    <rect x="0" y="22" width="6" height="26" rx="3" fill="url(#tpg)"/>
    <rect x="12" y="12" width="6" height="46" rx="3" fill="url(#tpg)" opacity=".75"/>
    <rect x="24" y="4" width="6" height="62" rx="3" fill="url(#tpg)" opacity=".5"/>
  </svg>
  <span style="font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:800;letter-spacing:1px;"><span style="color:#fff;">TACK</span><span style="color:#19b7ef;">PATH</span></span>
  <span style="font-size:1rem;font-weight:700;color:#fff;">FleetView</span>
  <div class="live-chip"><div class="live-dot"></div>LIVE</div>
  <span class="hdr-refresh" id="lastRefresh"></span>
  <a href="dispatcher.html" class="back-btn">← Dispatcher</a>
</div>

<div class="summary">
  <div class="sum-item"><div class="sum-val" style="color:#19b7ef;" id="s1">—</div><div class="sum-lbl">Active Drivers</div></div>
  <div class="sum-item"><div class="sum-val" id="s2">—</div><div class="sum-lbl">Total Packages</div></div>
  <div class="sum-item"><div class="sum-val" style="color:#53ff88;" id="s3">—</div><div class="sum-lbl">Delivered</div></div>
  <div class="sum-item"><div class="sum-val" style="color:rgba(255,255,255,.5);" id="s4">—</div><div class="sum-lbl">Remaining</div></div>
  <div class="sum-item"><div class="sum-val" style="color:#ff961e;" id="s5">—</div><div class="sum-lbl">Exceptions</div></div>
  <div class="sum-item"><div class="sum-val" style="color:#53ff88;" id="s6">—</div><div class="sum-lbl">Overall Progress</div></div>
</div>

<div class="controls">
  <select id="sortSel" onchange="render()">
    <option value="atten">Sort: Needs Attention</option>
    <option value="name">Sort: Name A–Z</option>
    <option value="hi">Sort: Rate High–Low</option>
    <option value="lo">Sort: Rate Low–High</option>
    <option value="exc">Sort: Exceptions First</option>
    <option value="ping">Sort: Last Ping</option>
  </select>
  <select id="filterSel" onchange="render()">
    <option value="all">All Drivers</option>
    <option value="exc">⚠ Exceptions Only</option>
    <option value="active">Active Only</option>
    <option value="done">Completed Only</option>
  </select>
  <input id="search" placeholder="🔍 Search driver..." oninput="render()"/>
  <div class="drv-count" id="dCount"></div>
</div>

<div class="tbl-wrap">
<table>
  <colgroup>
    <col class="c-driver"/><col class="c-status"/><col class="c-progress"/><col class="c-rate"/>
    <col class="c-stop"/><col class="c-ping"/><col class="c-started"/>
  </colgroup>
  <thead>
    <tr>
      <th>Driver</th><th>Status</th><th>Progress</th><th>Rate</th>
      <th>Last Stop</th><th>Last Ping</th><th>Started</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
let data=[], seen={};

function timeAgo(ts){
  if(!ts)return'—';
  const s=Math.floor((Date.now()-new Date(ts))/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}
function fmt(ts){
  if(!ts)return'—';
  return new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
}

function init(){
  const now=Date.now();
  const drivers=[
    ['Marcus Johnson','in_transit',52,38,'1245 Peachtree Rd NE',7200000,false],
    ['Denise Crawford','in_transit',48,21,'872 Piedmont Ave NE',6800000,false],
    ['Trevon Williams','in_transit',61,14,'3301 Buckeye Rd NE',5400000,true],
    ['Sandra Okafor','in_transit',44,40,'5600 Roswell Rd NE',8100000,false],
    ['James Tillman','in_transit',55,8,'1800 Howell Mill Rd NW',3600000,true],
    ['Keisha Monroe','in_transit',49,43,'2200 Cascade Rd SW',9000000,false],
    ['Andre Baptiste','in_transit',57,29,'650 Ponce De Leon Ave',6200000,false],
    ['Latoya Simmons','delivered',46,46,'All stops complete',10800000,false],
    ['Carlos Mendez','in_transit',53,17,'1100 Commerce Dr',4500000,false],
    ['Priya Nair','in_transit',50,33,'3800 Chamblee Tucker Rd',7000000,false],
    ['Darnell Foster','in_transit',58,6,'920 Ralph David Abernathy',2700000,true],
    ['Regina Holloway','in_transit',45,38,'7100 Peachtree Ind Blvd',8400000,false],
    ['Michael Osei','in_transit',62,22,'2750 Buford Hwy NE',5800000,false],
    ['Tamara Stokes','delivered',43,43,'All stops complete',11400000,false],
    ['Devon Reeves','in_transit',51,31,'1400 Metropolitan Pkwy SW',6600000,false],
    ['Angela Thompson','in_transit',56,44,'400 W Peachtree St NW',8800000,false],
    ['Robert Miller','in_transit',47,19,'890 Marietta St NW',5100000,false],
    ['Jennifer Davis','in_transit',54,11,'75 5th St NW',3900000,false],
    ['Kevin Harris','in_transit',48,36,'2500 Cumberland Pkwy SE',7800000,false],
    ['Patricia Moore','in_transit',60,28,'1544 Piedmont Ave NE',6400000,false],
  ];
  data=drivers.map(([name,status,tot,del,addr,offset,exc])=>({
    name,status,totalPackages:tot,delivered:del,lastAddr:addr,
    startedAt:new Date(now-offset).toISOString(),hasException:exc
  }));
  data.forEach((d,i)=>{seen[d.name]=new Date(now-(i%4)*45000-Math.random()*90000).toISOString();});
  updateSummary();render();
}

function updateSummary(){
  const tot=data.reduce((s,d)=>s+d.totalPackages,0);
  const del=data.reduce((s,d)=>s+d.delivered,0);
  document.getElementById('s1').textContent=data.filter(d=>d.status==='in_transit').length;
  document.getElementById('s2').textContent=tot;
  document.getElementById('s3').textContent=del;
  document.getElementById('s4').textContent=tot-del;
  document.getElementById('s5').textContent=data.filter(d=>d.hasException).length;
  document.getElementById('s6').textContent=tot>0?Math.round(del/tot*100)+'%':'—';
  document.getElementById('lastRefresh').textContent='Updated '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}

function render(){
  const sort=document.getElementById('sortSel').value;
  const filter=document.getElementById('filterSel').value;
  const q=document.getElementById('search').value.toLowerCase();
  let d=[...data];
  if(filter==='exc')d=d.filter(x=>x.hasException);
  else if(filter==='active')d=d.filter(x=>x.status==='in_transit');
  else if(filter==='done')d=d.filter(x=>x.status==='delivered');
  if(q)d=d.filter(x=>x.name.toLowerCase().includes(q));
  const pct=x=>Math.round(x.delivered/x.totalPackages*100);
  if(sort==='name')d.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='hi')d.sort((a,b)=>pct(b)-pct(a));
  else if(sort==='lo'||sort==='atten')d.sort((a,b)=>pct(a)-pct(b));
  else if(sort==='exc')d.sort((a,b)=>(b.hasException?1:0)-(a.hasException?1:0));
  else if(sort==='ping')d.sort((a,b)=>new Date(seen[a.name]||0)-new Date(seen[b.name]||0));
  document.getElementById('dCount').textContent=d.length+' driver'+(d.length!==1?'s':'');
  document.getElementById('tbody').innerHTML=d.map(dr=>{
    const p=pct(dr);
    const exc=dr.hasException,done=dr.status==='delivered';
    const bar=exc?'linear-gradient(90deg,#ff961e,#ff6b00)':p>=80?'#53ff88':p>=50?'linear-gradient(90deg,#19b7ef,#53ff88)':'linear-gradient(90deg,#19b7ef,#8d5cff)';
    const rc=exc?'#ff961e':p>=70?'#53ff88':'#19b7ef';
    const pill=exc?'<span class="pill p-exc">⚠ Exception</span>':done?'<span class="pill p-done">✓ Complete</span>':'<span class="pill p-transit">● In Transit</span>';
    return`<tr class="${exc?'exc':''}${done?' done':''}">
      <td><div class="d-name">${dr.name}</div></td>
      <td>${pill}</td>
      <td>
        <div class="prog-count">${dr.delivered} / ${dr.totalPackages}</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${p}%;background:${bar};"></div></div>
      </td>
      <td><span class="rate-val" style="color:${rc};">${p}%</span></td>
      <td><span class="addr">${dr.lastAddr}</span></td>
      <td><span class="ts">${timeAgo(seen[dr.name])}</span></td>
      <td><span class="ts">${fmt(dr.startedAt)}</span></td>
    </tr>`;
  }).join('');
}

function tick(){
  data.forEach(d=>{
    if(d.status==='in_transit'&&d.delivered<d.totalPackages&&Math.random()<0.35){
      d.delivered=Math.min(d.totalPackages,d.delivered+1);
      if(d.delivered>=d.totalPackages)d.status='delivered';
      seen[d.name]=new Date().toISOString();
    }
  });
  updateSummary();render();
}

init();
setInterval(tick,3000);
</script>
</body>
</html>

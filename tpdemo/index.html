<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#010e21">
<title>TackPath in 3 minutes | TackPath demo</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:'TackPath Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url('../tackpath-montserrat-500.ttf')}
:root{--navy:#010e21;--blue:#19b7ef;--text:#edf4fb;--muted:#9bb2c7;--line:#254054}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy);color:var(--text)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{width:100%;display:flex;justify-content:center;padding:28px 16px 8px}
.brand{display:inline-flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
.brand img{width:34px;height:40px;display:block}
.brand span{font-family:'TackPath Montserrat','Segoe UI',sans-serif;font-weight:500;font-size:26px;letter-spacing:1px}
main{width:100%;max-width:1200px;padding:24px 16px 32px;text-align:center;flex:1}
h1{font-size:clamp(28px,4.4vw,46px);font-weight:700;letter-spacing:-.5px;line-height:1.15}
.lede{margin-top:10px;font-size:clamp(16px,2vw,20px);color:var(--muted)}
.film{margin-top:28px;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.film video{display:block;width:100%;height:100%;background:#000}
footer{width:100%;padding:20px 16px 32px;text-align:center;font-size:14px;color:var(--muted)}
footer a{color:var(--blue);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:600px){header{padding-top:20px}main{padding-top:16px}.film{margin-top:20px;border-radius:10px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="https://tackpath.com"><img src="../logo.svg" alt="" width="34" height="40"><span>TackPath</span></a>
</header>
<main>
  <h1>TackPath in 3 minutes</h1>
  <p class="lede">From manifest to proof of delivery.</p>
  <div class="film">
    <video controls playsinline preload="metadata" aria-label="TackPath in 3 minutes">
      <source src="tackpath-demo.mp4" type="video/mp4">
      Your browser cannot play this video. <a href="tackpath-demo.mp4">Download it</a>.
    </video>
  </div>
</main>
<footer><a href="https://tackpath.com">tackpath.com</a></footer>
</body>
</html>

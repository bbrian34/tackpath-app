<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel Videos | TackPath</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../logo.svg">
<style>
:root{--navy:#0b2545;--blue:#1f8fd6;--ink:#1d2b3a;--muted:#5b6b7d;--line:#e3e9f0;--bg:#ffffff;--card:#f6f8fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#e8eef6;--ink:#e8eef6;--muted:#9fb0c3;--line:#26364a;--bg:#0d1724;--card:#132233}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
header{max-width:1040px;margin:0 auto;padding:28px 16px 8px;display:flex;align-items:center;gap:12px}
header img{height:30px}
header span{font-weight:600;letter-spacing:.32em;color:var(--navy);font-size:15px}
main{max-width:1040px;margin:0 auto;padding:8px 16px 48px}
h1{font-size:clamp(26px,3.4vw,38px);margin:10px 0 4px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 28px;max-width:640px}
.video{margin:0 0 36px}
h2{font-size:22px;margin:0 0 12px;color:var(--navy)}
video{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);background:var(--card)}
ol.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
ol.list button{width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
ol.list button[aria-current="true"]{border-color:var(--blue)}
p.next{margin:10px 0 0;color:var(--muted)}
footer{max-width:1040px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header><img src="../logo.svg" alt=""><span>TACKPATH</span></header>
<main>
  <h1>Warehouse management and last-mile delivery for 3PLs</h1>
  <p class="lead">One system, from the dock to the customer’s door.</p>
  <section class="video">
    <h2 id="title">TackPath and Keel</h2>
    <video id="player" controls playsinline preload="metadata" poster="tackpath-and-keel.jpg" src="tackpath-and-keel.mp4"></video>
    <p class="next" id="next" hidden></p>
    <ol class="list" id="list">
      <li><button type="button" data-i="0" aria-current="true">1. TackPath and Keel</button></li>
      <li><button type="button" data-i="1">2. Receiving &amp; Intelligent Putaway</button></li>
    </ol>
  </section>
</main>
<footer>© TackPath</footer>
<script>
// The videos play as a series: when one ends, the next starts 3 seconds later.
(function () {
  var videos = [
    { title: 'TackPath and Keel', src: 'tackpath-and-keel.mp4', poster: 'tackpath-and-keel.jpg' },
    { title: 'Receiving & Intelligent Putaway', src: 'receiving-and-intelligent-putaway.mp4', poster: 'receiving-and-intelligent-putaway.jpg' }
  ];
  var player = document.getElementById('player'), title = document.getElementById('title'), next = document.getElementById('next');
  var buttons = document.querySelectorAll('#list button'), current = 0, timer = null;
  function load(i, play) {
    clearTimeout(timer); next.hidden = true; current = i;
    player.poster = videos[i].poster; player.src = videos[i].src; title.textContent = videos[i].title;
    buttons.forEach(function (b) { b.setAttribute('aria-current', String(Number(b.dataset.i) === i)); });
    if (play) player.play().catch(function () {});
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { load(Number(b.dataset.i), true); }); });
  player.addEventListener('play', function () { clearTimeout(timer); next.hidden = true; });
  player.addEventListener('ended', function () {
    var i = current + 1; if (i >= videos.length) return;
    next.textContent = 'Up next: ' + videos[i].title + ', starting in 3 seconds';
    next.hidden = false;
    timer = setTimeout(function () { load(i, true); }, 3000);
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TackPath</title>
  <meta name="theme-color" content="#010e21">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:'TackPath Montserrat';font-style:normal;font-weight:500;font-display:block;src:url('tackpath-montserrat-500.ttf')}
    html,body{height:100%;margin:0}
    body{background:#010e21;color:#eef4ff;display:flex;flex-direction:column;
      padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
    .lockup{display:flex;align-items:center;gap:clamp(18px,4.2vw,56px)}
    .lockup img{height:clamp(52px,9vw,124px);width:auto;display:block}
    .wordmark{font-family:'TackPath Montserrat','Montserrat',sans-serif;font-weight:500;white-space:pre;line-height:1;
      font-size:clamp(26px,5.6vw,78px);letter-spacing:.06em}
    .wordmark span:first-child{color:#fff}.wordmark span:last-child{color:#19b7ef}
    footer{display:flex;justify-content:center;gap:22px;padding:20px 20px 26px;
      font:400 12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
    footer a{color:#6f8aa3;text-decoration:none}footer a:hover{color:#c8d7e6}
  </style>
</head>
<body>
  <main>
    <h1 class="lockup" aria-label="TackPath" style="margin:0;font-weight:inherit">
      <img src="logo.svg" alt="">
      <span class="wordmark" aria-hidden="true"><span>T Ʌ C K </span><span>P Ʌ T H</span></span>
    </h1>
  </main>
  <footer><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a></footer>
</body>
</html>

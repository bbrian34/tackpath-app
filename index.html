<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Holding page (2026-11): the TackPath logo and "One clear path." only, while the site is rebuilt.
       The full home page is kept unchanged in home-full.html (restore it by renaming it back to index.html). -->
  <meta name="description" content="TackPath: logistics operations software for the warehouse, the road and the dispatch desk.">
  <meta name="theme-color" content="#fafbfc">
  <meta property="og:type" content="website"><meta property="og:url" content="https://tackpath.com/">
  <meta property="og:title" content="TackPath"><meta property="og:description" content="One clear path.">
  <title>TackPath</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:'TackPath Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url('tackpath-montserrat-500.ttf')}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafbfc;color:#102b43;
      font-family:'Manrope','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;padding:24px 16px}
    main{display:flex;flex-direction:column;align-items:center;text-align:center}
    .mark{width:76px;height:89px;display:block}
    .wordmark{margin-top:26px;font-family:'TackPath Montserrat','Montserrat',sans-serif;font-weight:500;font-size:clamp(24px,4.4vw,34px);
      letter-spacing:.32em;padding-left:.32em;color:#102b43;white-space:nowrap}
    h1{margin-top:clamp(40px,7vh,64px);font-weight:600;font-size:clamp(38px,6.4vw,64px);letter-spacing:-.045em;line-height:1.12}
    /* the accent and its blue swoosh, exactly as on the home page */
    .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;letter-spacing:-.045em;color:#0783b0;position:relative}
    .serif:after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;border-top:2px solid #19b7ef;border-radius:50%;transform:rotate(-4deg)}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="logo.svg" alt="" width="76" height="89">
    <div class="wordmark" aria-label="TackPath">T Ʌ C K P Ʌ T H</div>
    <h1>One clear <span class="serif">path.</span></h1>
  </main>
</body>
</html>

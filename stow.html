<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>PathIQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;700&display=swap');
:root{
  --bg:#ffffff; --card:#ffffff; --card2:#f2f4f6; --border:#c8ced4;
  --text:#111418; --muted:#4a525a; --faint:#767e86;
  --blue:#0b6fb0; --green:#0a7a2f; --orange:#a85a00; --red:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
.top{padding:16px 18px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:12px;min-height:24px;}
.back-btn{background:none;border:none;color:var(--blue);font-family:'DM Sans',sans-serif;font-weight:700;font-size:1rem;padding:4px 0;}
.top-title{font-weight:800;font-size:1.1rem;}
.wrap{padding:18px;max-width:520px;margin:0 auto;}
.screen{display:none;}
.screen.on{display:block;}

.app-header{text-align:center;padding:18px 0 4px;border-bottom:2px solid #111418;margin-bottom:18px;}
.app-brand{font-family:'Montserrat',sans-serif;font-weight:500;font-size:.8rem;letter-spacing:1px;color:var(--faint);}
.app-title{font-size:1.9rem;font-weight:500;color:var(--text);letter-spacing:1px;font-family:'Montserrat',sans-serif;line-height:1.15;}
.app-subtitle{font-family:'DM Sans',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin-top:4px;}
.app-tagline{font-family:'DM Sans',sans-serif;font-size:.85rem;color:#111418;margin-top:2px;}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.big-card{position:relative;background:#fff;border:2px solid #111418;border-radius:6px;padding:14px 8px;aspect-ratio:1.3;display:flex;align-items:center;justify-content:center;text-align:center;color:#111418;font-family:'DM Sans',sans-serif;box-shadow:0 3px 0 #111418;transition:all .08s ease-out;cursor:pointer;}
.big-card:active{box-shadow:0 0 0 #111418;transform:translateY(3px);background:#f0f2f4;}
.big-card-title{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}

.hw-input-row{display:flex;gap:8px;margin-bottom:16px;}
.code-bar{background:#d9f2a3;color:#111418;text-align:center;padding:14px 12px;font-family:'DM Mono',monospace;font-size:1.15rem;font-weight:800;letter-spacing:.03em;border-bottom:2px solid #a8c96b;}
.hidden-scan-input{width:100%;max-width:200px;margin:8px auto 0;display:block;padding:8px;font-size:0.85rem;font-family:'DM Mono',monospace;text-align:center;border:1px solid #ccc;border-radius:6px;background:#fafafa;color:#333;}
.scan-icon-wrap{text-align:center;padding:20px 0 24px;}
.scan-heading{font-size:1.3rem;font-weight:800;margin-bottom:16px;}
.hw-input-row input{flex:1;background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:16px;color:var(--text);font-family:'DM Mono',monospace;font-size:1.1rem;text-align:center;font-weight:700;}
.hw-hint{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--faint);text-align:center;margin-bottom:16px;}

.result-card{background:var(--card2);border:3px solid var(--border);border-radius:10px;padding:24px;text-align:center;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.result-card.success{border-color:var(--green);background:#eef8ef;}
.result-card.staged{border-color:var(--green);background:#e3f5e6;}
.result-card.error{border-color:var(--red);background:#fbeceb;}
.result-bin{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:700;}
.result-bin-num{font-size:2.6rem;font-weight:800;color:var(--blue);line-height:1;margin-bottom:8px;}
.result-bin-num.success{color:var(--green);}
.result-bin-num.error{color:var(--red);}
.result-detail{font-size:.9rem;color:var(--muted);font-weight:600;}

.bins-panel{padding:0;}
.bins-panel-lbl{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;font-weight:700;}
.bin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--card2);font-size:.9rem;font-weight:600;}
.bin-row:last-child{border-bottom:none;}
.bin-row.tappable{cursor:pointer;}
.bin-row.tappable:active{background:var(--card2);}
.bin-num-chip{font-family:'DM Mono',monospace;font-weight:800;background:var(--card2);border:2px solid var(--border);padding:4px 10px;border-radius:6px;color:var(--blue);}
.bin-progress{font-family:'DM Mono',monospace;font-size:.85rem;color:var(--faint);font-weight:700;}
.staged-row{background:#eef8ef;}
.staged-badge{font-family:'DM Sans',monospace;font-size:.75rem;font-weight:800;color:var(--green);letter-spacing:.02em;white-space:nowrap;}
.empty-note{text-align:center;padding:30px 12px;color:var(--faint);font-size:.9rem;}

.confirm-box{background:var(--card);border:3px solid var(--orange);border-radius:10px;padding:20px;text-align:center;}
.confirm-title{font-weight:800;font-size:1.15rem;margin-bottom:8px;}
.confirm-sub{font-size:.88rem;color:var(--muted);margin-bottom:18px;}
.confirm-row{display:flex;gap:10px;}
.confirm-btn{flex:1;padding:16px;border-radius:8px;font-weight:800;font-size:.95rem;border:2px solid var(--border);font-family:'DM Sans',sans-serif;}
.confirm-btn.yes{background:var(--orange);color:#fff;border-color:var(--orange);}
.confirm-btn.no{background:var(--card2);color:var(--text);}

.action-btn{width:100%;padding:18px;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;font-size:1.05rem;border:none;font-family:'DM Sans',sans-serif;margin-top:6px;}
.step-label{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:12px;font-weight:700;}
</style>
</head>
<body>

<div class="top" id="topBar">
  <span id="topTitle" class="top-title"></span>
</div>

<div class="wrap">

  <!-- HOME -->
  <div class="screen on" id="scHome">
    <div class="app-header">
      <img src="pathiq-logo.png" alt="PathIQ" style="height:36px;display:block;margin:0 auto;"/>
    </div>
    <div class="card-grid">
      <button class="big-card" onclick="goTo('assignbins')">
        <div class="big-card-title">Assign Bins</div>
      </button>
      <button class="big-card" onclick="goTo('stow')">
        <div class="big-card-title">Stow</div>
      </button>
      <button class="big-card" onclick="goTo('receive')">
        <div class="big-card-title">Problem</div>
      </button>
      <button class="big-card" onclick="goTo('reset')">
        <div class="big-card-title">Reset Bin</div>
      </button>
      <button class="big-card" onclick="alert('SmartSort: still deciding exactly what this does')">
        <div class="big-card-title">SmartSort</div>
      </button>
      <button class="big-card" onclick="alert('WMS: still deciding exactly what this does')">
        <div class="big-card-title">WMS</div>
      </button>
      <button class="big-card" onclick="alert('Connect: still deciding exactly what this does')">
        <div class="big-card-title">Connect</div>
      </button>
    </div>
  </div>

  <!-- ASSIGN BINS -->
  <div class="screen" id="scAssignbins">
    <div class="hw-input-row">
      <input type="text" id="assignBinInput" placeholder="Scan bin QR code"/>
    </div>
    <div class="hw-hint">Scan a bin's permanent QR code to assign it a route</div>
    <div class="result-card" id="assignBinResult" style="display:none;"></div>
    <div id="assignRouteList"></div>
  </div>

  <!-- STOW -->
  <div class="screen" id="scStow">
    <div class="code-bar" id="codeBar" style="display:none;"></div>
    <div class="scan-icon-wrap">
      <div class="scan-heading">Scan package</div>
      <svg width="140" height="60" viewBox="0 0 140 60">
        <rect x="0" y="0" width="4" height="60" fill="#111418"/>
        <rect x="8" y="0" width="2" height="60" fill="#111418"/>
        <rect x="14" y="0" width="6" height="60" fill="#111418"/>
        <rect x="24" y="0" width="2" height="60" fill="#111418"/>
        <rect x="30" y="0" width="4" height="60" fill="#111418"/>
        <rect x="38" y="0" width="2" height="60" fill="#111418"/>
        <rect x="44" y="0" width="8" height="60" fill="#111418"/>
        <rect x="56" y="0" width="2" height="60" fill="#111418"/>
        <rect x="62" y="0" width="4" height="60" fill="#111418"/>
        <rect x="70" y="0" width="6" height="60" fill="#111418"/>
        <rect x="80" y="0" width="2" height="60" fill="#111418"/>
        <rect x="86" y="0" width="4" height="60" fill="#111418"/>
        <rect x="94" y="0" width="2" height="60" fill="#111418"/>
        <rect x="100" y="0" width="8" height="60" fill="#111418"/>
        <rect x="112" y="0" width="2" height="60" fill="#111418"/>
        <rect x="118" y="0" width="4" height="60" fill="#111418"/>
        <rect x="126" y="0" width="2" height="60" fill="#111418"/>
        <rect x="132" y="0" width="6" height="60" fill="#111418"/>
      </svg>
    </div>
    <input type="text" id="stowInput" class="hidden-scan-input" placeholder="Scan here"/>
    <div class="result-card" id="stowResult" style="display:none;"></div>
    <div id="debugPanel" style="background:#000;color:#0f0;font-family:monospace;font-size:0.7rem;padding:10px;border-radius:6px;margin-bottom:12px;white-space:pre-wrap;word-break:break-all;"></div>
    <div class="bins-panel" id="binsPanel"></div>
  </div>

  <!-- PROBLEM: RECEIVE -->
  <div class="screen" id="scReceive">
    <div class="step-label">Step 1 of 2 &middot; Receive</div>
    <div class="hw-input-row">
      <input type="text" id="receiveInput" placeholder="Scan the missed package"/>
    </div>
    <div class="hw-hint">Scan the package that was missed before arriving here</div>
    <div class="result-card" id="receiveResult">
      <div class="result-bin">Ready</div>
      <div class="result-bin-num" style="font-size:1.3rem;color:var(--faint);">Scan the package to receive it</div>
    </div>
  </div>

  <!-- PROBLEM: INDUCT -->
  <div class="screen" id="scInduct">
    <div class="step-label">Step 2 of 2 &middot; Induct</div>
    <div class="result-card success" id="inductSummary"></div>
    <button class="action-btn" onclick="confirmInduct()">Confirm Induction</button>
  </div>

  <!-- RESET BIN -->
  <div class="screen" id="scReset">
    <div class="bins-panel" id="resetBinsPanel" style="margin-bottom:16px;"></div>
    <div id="resetConfirmArea"></div>
  </div>

</div>

<script>
const SB='https://hofijsiphyjpdvujjzfi.supabase.co';
const KEY='sb_publishable_wTbmXugtlItd1VGIzTMJZQ_Thd5v1Gp';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};

let jobs=[];
let binMap={};
let binProgress={};
let scannedByBin={};
let pendingPlacement=null;
let exceptionLog=[];
let pendingInduct=null;

const SCREENS=['scHome','scAssignbins','scStow','scReceive','scInduct','scReset'];
const TITLES={scHome:'', scAssignbins:'Assign bins', scStow:'Stow', scReceive:'Receive', scInduct:'Induct', scReset:'Reset bin'};
const BACK_TARGET={scAssignbins:'home', scStow:'home', scReceive:'home', scInduct:'receive', scReset:'home'};

function goTo(screen){
  const id='sc'+screen.charAt(0).toUpperCase()+screen.slice(1);
  SCREENS.forEach(s=>document.getElementById(s).classList.toggle('on', s===id));
  const topBar=document.getElementById('topBar');
  if(id==='scHome'){
    topBar.innerHTML='<span id="topTitle" class="top-title"></span>';
  } else {
    const backTo=BACK_TARGET[id];
    topBar.innerHTML='<button class="back-btn" onclick="goTo(\'' + backTo + '\')">&#8249; Back</button><span id="topTitle" class="top-title">'+(TITLES[id]||'')+'</span>';
  }
  if(id==='scAssignbins'){ resetAssignBinResult(); loadUnassignedRoutes(); document.getElementById('assignBinInput').focus(); }
  if(id==='scStow'){ resetStowResult(); renderBinsPanel(); document.getElementById('stowInput').focus(); }
  if(id==='scReceive'){ resetReceiveResult(); document.getElementById('receiveInput').focus(); }
  if(id==='scReset'){ renderResetBinsPanel(); document.getElementById('resetConfirmArea').innerHTML=''; }
  if(id==='scInduct'){ renderInductSummary(); }
}

async function loadRoutes(){
  let fetchErrorOccurred=false;
  try{
    const r=await fetch(SB+'/rest/v1/jobs?status=in.(pending,assigned,in_transit)&order=created_at.asc&limit=50&apikey='+KEY,{headers:H});
    jobs=await r.json();
    if(!Array.isArray(jobs)){
      fetchErrorOccurred=true;
      const dbgElBad=document.getElementById('debugPanel');
      if(dbgElBad) dbgElBad.textContent='FETCH RETURNED NON-ARRAY (likely auth/permission error)\nhttp status = '+r.status+'\nresponse = '+JSON.stringify(jobs).slice(0,300);
      console.log('FETCH RETURNED NON-ARRAY', r.status, jobs);
      jobs=[];
    }
  }catch(e){
    fetchErrorOccurred=true;
    jobs=[];
    const dbgEl0=document.getElementById('debugPanel');
    if(dbgEl0) dbgEl0.textContent='FETCH FAILED\nerror = '+e.message+'\nname = '+e.name;
    console.log('FETCH FAILED', e);
  }

  binMap={};
  const newProgress={};
  jobs.forEach((j)=>{
    const binNum=j.bin_label;
    if(!binNum) return;
    let stops=j.surge_stops;
    if(typeof stops==='string'){try{stops=JSON.parse(stops);}catch(e){stops=null;}}
    const stopList=Array.isArray(stops)?stops:[];
    const already=binProgress[binNum];
    newProgress[binNum]={total:stopList.length||1, sorted:already?already.sorted:0, jobTitle:j.title||'Untitled Route', jobId:j.id};
    stopList.forEach(s=>{
      // A physical package's real, pre-printed identifier (tracking_number
      // or order_id) is permanent -- it's fixed before the package ever
      // arrives. smart_id is computed internally from stop position within
      // a route, which can change every time SmartSort re-clusters. A
      // stable, real-world barcode can never chase a value that shifts on
      // every run, so it must win the match, not lose to it.
      const stableCode=s.tracking_number||s.order_id||s.orderId;
      if(stableCode) binMap[String(stableCode).toUpperCase()]={binNum, jobId:j.id, jobTitle:j.title||'Untitled Route', address:s.address||''};
      const code=s.smart_id||s.id;
      if(code) binMap[String(code).toUpperCase()]={binNum, jobId:j.id, jobTitle:j.title||'Untitled Route', address:s.address||''};
    });
    if(j.id) binMap[j.id.slice(0,8).toUpperCase()]={binNum, jobId:j.id, jobTitle:j.title||'Untitled Route', address:'', isRouteLevel:true};
  });
  binProgress=newProgress;

  // ── DIAGNOSTIC: confirm binMap actually built correctly, and whether
  // the specific real test package genuinely exists as a key ──
  const debugMsg1 = 'BINMAP BUILT\ncount = '+Object.keys(binMap).length
    +'\nhas TP6100001 = '+('TP6100001' in binMap)
    +'\nTP6100001 -> '+JSON.stringify(binMap['TP6100001']||null)
    +'\njobs fetched from Supabase = '+jobs.length
    +'\nraw jobs contain TP6100001 = '+JSON.stringify(jobs).includes('TP6100001');
  console.log(debugMsg1);
  const dbgEl = document.getElementById('debugPanel');
  if(dbgEl && !fetchErrorOccurred) dbgEl.textContent = debugMsg1;

  if(document.getElementById('scStow').classList.contains('on')) renderBinsPanel();
  if(document.getElementById('scReset').classList.contains('on')) renderResetBinsPanel();
}

function renderBinsPanel(){
  const el=document.getElementById('binsPanel');
  const nums=Object.keys(binProgress);
  if(!nums.length){
    el.innerHTML='<div class="empty-note">No active routes right now. Run SmartSort first.</div>';
    return;
  }
  const sortedNums=[...nums].sort((a,b)=>{
    const aDone=binProgress[a].sorted>=binProgress[a].total;
    const bDone=binProgress[b].sorted>=binProgress[b].total;
    if(aDone!==bDone) return aDone?-1:1;
    return parseInt(a) - parseInt(b);
  });
  el.innerHTML=sortedNums.map(n=>{
    const p=binProgress[n];
    const complete=p.sorted>=p.total;
    return '<div class="bin-row '+(complete?'staged-row':'')+'">'
      +'<span><span class="bin-num-chip">Bin '+n+'</span> '+p.jobTitle+'</span>'
      +(complete
        ? '<span class="staged-badge">&#10003; STAGED &middot; READY FOR PICKUP</span>'
        : '<span class="bin-progress">'+p.sorted+' of '+p.total+' sorted</span>')
      +'</div>';
  }).join('');
}

// ── ASSIGN BINS ──
// Bins are permanent physical objects with fixed QR codes. A route only
// gets linked to one through this deliberate step, never guessed at by
// creation order. Scan the bin, then pick which of today's unassigned
// routes it carries.
let unassignedRoutes=[];
let pendingBinScan=null;

async function loadUnassignedRoutes(){
  try{
    const r=await fetch(SB+'/rest/v1/jobs?bin_label=is.null&status=in.(pending,assigned,in_transit)&order=created_at.asc&apikey='+KEY,{headers:H});
    unassignedRoutes=await r.json();
    if(!Array.isArray(unassignedRoutes)) unassignedRoutes=[];
  }catch(e){ unassignedRoutes=[]; }
  renderAssignRouteList();
}

function renderAssignRouteList(){
  const el=document.getElementById('assignRouteList');
  if(!pendingBinScan){ el.innerHTML=''; return; }
  if(!unassignedRoutes.length){
    el.innerHTML='<div class="empty-note">No unassigned routes right now.</div>';
    return;
  }
  el.innerHTML='<div class="bins-panel-lbl">Assign Bin '+pendingBinScan+' to:</div>'
    + unassignedRoutes.map(function(j){
      const stopCount=(j.surge_stops||[]).length || j.total_stops || 0;
      return '<div class="bin-row tappable" onclick="confirmBinAssignment(\''+j.id+'\')">'
        +'<span>'+(j.title||'Untitled Route')+'</span>'
        +'<span class="bin-progress">'+stopCount+' stops</span>'
        +'</div>';
    }).join('');
}

function resetAssignBinResult(){
  const card=document.getElementById('assignBinResult');
  card.style.display='none';
  card.innerHTML='';
  pendingBinScan=null;
  document.getElementById('assignRouteList').innerHTML='';
}

function handleAssignBinScan(code){
  const clean=code.trim().toUpperCase();
  if(!clean) return;
  pendingBinScan=clean;
  const card=document.getElementById('assignBinResult');
  card.style.display='flex';
  card.className='result-card';
  card.innerHTML='<div class="result-bin">Bin Scanned</div><div class="result-bin-num" style="font-size:2rem;">'+clean+'</div><div class="result-detail">Select which route this bin carries today</div>';
  renderAssignRouteList();
}

async function confirmBinAssignment(jobId){
  try{
    await fetch(SB+'/rest/v1/jobs?id=eq.'+jobId,{
      method:'PATCH',
      headers:Object.assign({},H,{'Content-Type':'application/json'}),
      body:JSON.stringify({bin_label:pendingBinScan})
    });
    const card=document.getElementById('assignBinResult');
    card.className='result-card success';
    card.innerHTML='<div class="result-bin">Assigned</div><div class="result-bin-num success">Bin '+pendingBinScan+'</div><div class="result-detail">Ready to scan the next bin</div>';
    pendingBinScan=null;
    document.getElementById('assignRouteList').innerHTML='';
    loadUnassignedRoutes();
  }catch(e){
    const card=document.getElementById('assignBinResult');
    card.className='result-card error';
    card.innerHTML='<div class="result-bin">Assignment Failed</div><div class="result-detail">'+e.message+'</div>';
  }
}

function resetStowResult(){
  pendingPlacement=null;
  const card=document.getElementById('stowResult');
  card.style.display='none';
  card.className='result-card';
  card.innerHTML='';
  const bar=document.getElementById('codeBar');
  bar.style.display='none';
  bar.textContent='';
}

function handleStowScan(code){
  const clean=code.trim().toUpperCase();

  // ── DIAGNOSTIC: full chain from raw input through lookup result.
  // Appends to whatever the native bridge already wrote, so a single
  // screenshot shows every step together, not just the last one to run ──
  const keys=Object.keys(binMap);
  const found=(clean in binMap);
  const debugLines=[
    'RAW SCAN VALUE = '+JSON.stringify(code)+' (length '+code.length+')',
    'NORMALIZED VALUE = '+JSON.stringify(clean)+' (length '+clean.length+')',
    'EXACT LOOKUP: binMap has normalized value = '+found
  ];
  if(found){
    debugLines.push('MATCHED BIN = '+JSON.stringify(binMap[clean]));
  } else {
    debugLines.push('binMap has "TP6100001" (known-good key) = '+('TP6100001' in binMap));
    debugLines.push('keys starting with TP6100001 = '+JSON.stringify(keys.filter(k=>k.startsWith('TP6100001'))));
    debugLines.push('JSON.stringify(normalized) = '+JSON.stringify(clean));
    debugLines.push('JSON.stringify("TP6100001") = '+JSON.stringify('TP6100001'));
    debugLines.push('SAMPLE KEYS (first 10) = '+JSON.stringify(keys.slice(0,10)));
  }
  const debugMsg2=debugLines.join('\n');
  console.log(debugMsg2);
  const dbgEl2=document.getElementById('debugPanel');
  const existingDbg=dbgEl2 ? dbgEl2.textContent : '';
  if(dbgEl2) dbgEl2.textContent=(existingDbg?existingDbg+'\n\n':'')+debugMsg2;

  if(!clean)return;
  const bar=document.getElementById('codeBar');
  bar.style.display='block';
  bar.textContent=clean;
  const card=document.getElementById('stowResult');
  card.style.display='flex';

  // ── STEP 2: confirming placement, expecting the bin's own QR code ──
  // A package was already scanned and is waiting on its bin confirmation.
  // This scan is checked against THAT specific pending bin, not looked up
  // as a package at all.
  if(pendingPlacement){
    if(clean===pendingPlacement.binNum){
      const binNum=pendingPlacement.binNum;
      if(!scannedByBin[binNum]) scannedByBin[binNum]=new Set();
      scannedByBin[binNum].add(pendingPlacement.code);
      binProgress[binNum].sorted=Math.min(binProgress[binNum].total, binProgress[binNum].sorted+1);
      const justCompleted=binProgress[binNum].sorted>=binProgress[binNum].total;
      const jobTitle=pendingPlacement.jobTitle;
      pendingPlacement=null;

      if(justCompleted){
        card.className='result-card staged';
        card.innerHTML='<div class="result-bin" style="color:var(--green);">&#10003; Bin Complete</div><div class="result-bin-num success" style="font-size:2.1rem;">Bin '+binNum+'</div><div class="result-detail" style="color:var(--green);font-weight:700;">STAGED &middot; READY FOR PICKUP</div><div class="result-detail" style="margin-top:4px;">'+jobTitle+' &middot; all '+binProgress[binNum].total+' packages sorted</div>';
      } else {
        card.className='result-card success';
        card.innerHTML='<div class="result-bin">&#10003; Confirmed</div><div class="result-bin-num success">Bin '+binNum+'</div><div class="result-detail">'+binProgress[binNum].sorted+' of '+binProgress[binNum].total+' sorted</div>';
      }
      renderBinsPanel();
    } else {
      // Wrong bin scanned. Package stays pending - worker can try the
      // correct bin without needing to re-scan the package.
      card.className='result-card error';
      card.innerHTML='<div class="result-bin">Wrong Bin</div><div class="result-bin-num error" style="font-size:1.4rem;">Expected Bin '+pendingPlacement.binNum+'</div><div class="result-detail">Scan Bin '+pendingPlacement.binNum+' to confirm, or scan the correct bin now.</div>';
    }
    return;
  }

  // ── STEP 1: scanning a package - shows the instruction only, does not
  // count until the matching bin is actually scanned ──
  const match=binMap[clean];

  if(!match){
    card.className='result-card error';
    card.innerHTML='<div class="result-bin">Not Found</div><div class="result-bin-num error" style="font-size:1.4rem;">Unrecognized code</div><div class="result-detail">"'+code+'" does not match any active route or package.</div>';
    return;
  }

  if(!scannedByBin[match.binNum]) scannedByBin[match.binNum]=new Set();
  if(scannedByBin[match.binNum].has(clean)){
    card.className='result-card';
    card.innerHTML='<div class="result-bin">Already Sorted</div><div class="result-bin-num" style="color:var(--orange);">Bin '+match.binNum+'</div><div class="result-detail">This package was already scanned.</div>';
    return;
  }

  pendingPlacement={binNum:match.binNum, code:clean, jobTitle:match.jobTitle};
  card.className='result-card success';
  card.innerHTML='<div class="result-bin">Place In</div><div class="result-bin-num success">Bin '+match.binNum+'</div><div class="result-detail">'+match.jobTitle+(match.address?' &middot; '+match.address:'')+'</div><div class="result-detail" style="margin-top:6px;font-weight:700;">Scan Bin '+match.binNum+' to confirm</div>';
}

function resetReceiveResult(){
  const card=document.getElementById('receiveResult');
  card.className='result-card';
  card.innerHTML='<div class="result-bin">Ready</div><div class="result-bin-num" style="font-size:1.3rem;color:var(--faint);">Scan the package to receive it</div>';
}

function handleReceiveScan(code){
  const clean=code.trim().toUpperCase();
  if(!clean)return;
  const card=document.getElementById('receiveResult');
  const match=binMap[clean];

  if(!match){
    card.className='result-card error';
    card.innerHTML='<div class="result-bin">Not Found</div><div class="result-bin-num error" style="font-size:1.4rem;">Not in manifest</div><div class="result-detail">"'+code+'" does not match anything SmartSort has assigned.</div>';
    return;
  }

  pendingInduct={code:clean, binNum:match.binNum, jobTitle:match.jobTitle, address:match.address};
  card.className='result-card success';
  card.innerHTML='<div class="result-bin">Received</div><div class="result-bin-num success">Bin '+match.binNum+'</div><div class="result-detail">'+match.jobTitle+'</div>';
  setTimeout(function(){ goTo('induct'); }, 500);
}

function renderInductSummary(){
  const el=document.getElementById('inductSummary');
  if(!pendingInduct){ el.innerHTML='<div class="empty-note">No package pending induction.</div>'; return; }
  el.innerHTML='<div class="result-bin">Pending Induction</div><div class="result-bin-num success">Bin '+pendingInduct.binNum+'</div><div class="result-detail">'+pendingInduct.jobTitle+(pendingInduct.address?' &middot; '+pendingInduct.address:'')+'</div><div class="result-detail" style="margin-top:6px;font-family:\'DM Mono\',monospace;font-size:.7rem;">'+pendingInduct.code+'</div>';
}

function confirmInduct(){
  if(!pendingInduct)return;
  const record=Object.assign({}, pendingInduct, {time:new Date()});
  exceptionLog.push(record);
  const doneCode=pendingInduct.code;
  pendingInduct=null;
  goTo('stow');
  document.getElementById('stowResult').innerHTML='<div class="result-bin">Inducted</div><div class="result-bin-num" style="font-size:1.2rem;color:var(--faint);">Now scan '+doneCode+' to stow it</div>';
}

function renderResetBinsPanel(){
  const el=document.getElementById('resetBinsPanel');
  const nums=Object.keys(binProgress);
  if(!nums.length){
    el.innerHTML='<div class="bins-panel-lbl">Active Bins</div><div class="empty-note">No active bins right now.</div>';
    return;
  }
  const sortedNums=[...nums].sort(function(a,b){ return parseInt(a)-parseInt(b); });
  el.innerHTML='<div class="bins-panel-lbl">Select a bin to reset</div>' + sortedNums.map(function(n){
    const p=binProgress[n];
    return '<div class="bin-row tappable" onclick="askResetConfirm(\''+n+'\')">'
      +'<span><span class="bin-num-chip">Bin '+n+'</span> '+p.jobTitle+'</span>'
      +'<span class="bin-progress">'+p.sorted+' of '+p.total+' sorted</span>'
      +'</div>';
  }).join('');
}

function askResetConfirm(binNum){
  const p=binProgress[binNum];
  document.getElementById('resetConfirmArea').innerHTML=
    '<div class="confirm-box">'
    +'<div class="confirm-title">Reset Bin '+binNum+'?</div>'
    +'<div class="confirm-sub">'+p.sorted+' of '+p.total+' packages currently marked sorted. This clears its progress back to 0 so it can be sorted again from scratch.</div>'
    +'<div class="confirm-row">'
    +'<button class="confirm-btn no" onclick="document.getElementById(\'resetConfirmArea\').innerHTML=\'\'">Cancel</button>'
    +'<button class="confirm-btn yes" onclick="doResetBin(\''+binNum+'\')">Reset it</button>'
    +'</div></div>';
}

function doResetBin(binNum){
  if(binProgress[binNum]) binProgress[binNum].sorted=0;
  if(scannedByBin[binNum]) scannedByBin[binNum].clear();
  document.getElementById('resetConfirmArea').innerHTML='<div class="result-card success"><div class="result-bin">Reset</div><div class="result-bin-num success">Bin '+binNum+'</div><div class="result-detail">Ready to be sorted again.</div></div>';
  renderResetBinsPanel();
}

document.getElementById('assignBinInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ handleAssignBinScan(e.target.value); e.target.value=''; }
});
document.getElementById('stowInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    const dbgClear=document.getElementById('debugPanel');
    if(dbgClear) dbgClear.textContent='';
    handleStowScan(e.target.value); e.target.value='';
  }
});
document.getElementById('receiveInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ handleReceiveScan(e.target.value); e.target.value=''; }
});
document.addEventListener('click', function(){
  if(document.getElementById('scStow').classList.contains('on')) document.getElementById('stowInput').focus();
  if(document.getElementById('scReceive').classList.contains('on')) document.getElementById('receiveInput').focus();
});

loadRoutes();
setInterval(loadRoutes, 5000);

// ── NATIVE SCANNER BRIDGE ──
// The FARSET/ARBOR G47 does not emulate a keyboard -- confirmed by two
// direct tests, inside the packaged app and in plain Chrome, both
// receiving nothing on scan. It only broadcasts. This listens for that
// broadcast via the native FarsetScanner plugin and routes the decoded
// value into the exact same functions a keyboard-wedge scan would have
// called, based on whichever screen is actually open. Nothing about the
// existing scan-handling logic itself changes.
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FarsetScanner) {
  window.Capacitor.Plugins.FarsetScanner.addListener('scan', function(data){
    // ── DIAGNOSTIC: exact raw shape from the native plugin, before
    // anything touches it ──
    const bridgeDbg = 'NATIVE BRIDGE EVENT RECEIVED\n'
      +'typeof data = '+typeof data+'\n'
      +'raw data = '+JSON.stringify(data)+'\n'
      +'data.value = '+JSON.stringify(data.value)+'\n'
      +'typeof data.value = '+typeof data.value;
    console.log(bridgeDbg);
    const dbgElBridge=document.getElementById('debugPanel');
    if(dbgElBridge) dbgElBridge.textContent=bridgeDbg;

    const value = data.value;
    if(!value) return;
    if(document.getElementById('scStow').classList.contains('on')){
      handleStowScan(value);
    } else if(document.getElementById('scReceive').classList.contains('on')){
      handleReceiveScan(value);
    } else if(document.getElementById('scAssignbins').classList.contains('on')){
      handleAssignBinScan(value);
    }
  });
}

</script>
</body>
</html>

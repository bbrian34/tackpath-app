<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>PathIQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;700&family=Dancing+Script:wght@700&display=swap');
:root{
  --bg:#ffffff; --card:#ffffff; --card2:#f2f4f6; --border:#c8ced4;
  --text:#111418; --muted:#4a525a; --faint:#767e86;
  --blue:#0b6fb0; --green:#0a7a2f; --orange:#a85a00; --red:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#e9ecef;color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
.top{padding:16px 18px;border-bottom:1px solid #e4e8ec;display:flex;align-items:center;gap:12px;min-height:24px;background:#fff;}
.back-btn{background:none;border:none;color:var(--blue);font-family:'DM Sans',sans-serif;font-weight:700;font-size:1rem;padding:4px 0;}
.top-title{font-weight:800;font-size:1.1rem;}
.wrap{padding:18px;max-width:520px;margin:0 auto;}
.screen{display:none;}
.screen.on{display:block;}

.app-header{text-align:center;padding:24px 18px 20px;margin:-18px -18px 18px;background:linear-gradient(135deg,#0b6fb0,#084d7a);box-shadow:0 2px 8px rgba(0,0,0,.12);}
.app-footer{text-align:center;padding:16px 18px;margin:24px -18px -18px;background:linear-gradient(135deg,#0b6fb0,#084d7a);color:rgba(255,255,255,.85);font-family:'DM Sans',sans-serif;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;}
.utility-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:30px 16px 6px;}
.utility-btn{width:80%;margin:0 auto;background:#eceef0;border:1px solid #d8dee2;border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;padding:12px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.06);}
.utility-btn:active{box-shadow:0 1px 2px rgba(0,0,0,.04) inset;transform:translateY(1px);background:#f7f9fa;}
.app-brand{font-family:'Montserrat',sans-serif;font-weight:500;font-size:.8rem;letter-spacing:1px;color:var(--faint);}
.app-title{font-size:1.9rem;font-weight:500;color:var(--text);letter-spacing:1px;font-family:'Montserrat',sans-serif;line-height:1.15;}
.app-subtitle{font-family:'DM Sans',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin-top:4px;}
.app-tagline{font-family:'DM Sans',sans-serif;font-size:.85rem;color:#111418;margin-top:2px;}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;padding:0 16px;}
.big-card{position:relative;background:#fff;border:1px solid #e4e8ec;border-radius:10px;padding:8px 4px;aspect-ratio:1.7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;color:#111418;font-family:'DM Sans',sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.06);transition:all .12s ease-out;cursor:pointer;}
.big-card svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.8;}
#barcodeIcon{display:block;margin:0 auto;}
.big-card:active{box-shadow:0 1px 2px rgba(0,0,0,.04) inset;transform:translateY(1px);background:#f7f9fa;}
.big-card-title{font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}

.hw-input-row{display:flex;gap:8px;margin-bottom:16px;}
.code-bar{background:#d9f2a3;color:#111418;text-align:center;padding:14px 12px;font-family:'DM Mono',monospace;font-size:1.15rem;font-weight:800;letter-spacing:.03em;border-bottom:2px solid #a8c96b;}
.hidden-scan-input{width:100%;max-width:200px;height:32px;margin:0 auto;display:block;padding:8px;font-size:0.85rem;font-family:'DM Mono',monospace;text-align:center;border:none;outline:none;box-shadow:none;border-radius:6px;background:#e9ecef;color:#e9ecef;caret-color:transparent;}
.hidden-scan-input::placeholder{color:#e9ecef;opacity:1;}
.hidden-scan-input::placeholder{color:#fff;}
.flip-card-container{margin:0 16px 16px;height:150px;perspective:1000px;}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip-card-inner.flipped{transform:rotateY(180deg);}
.flip-card-face{position:absolute;top:0;left:0;width:100%;height:100%;box-sizing:border-box;border-radius:10px;border:3px solid #111418;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;background:#fff;}
.flip-card-back{transform:rotateY(180deg);background-color:#22a559;border-color:#22a559;}
.flip-bin-number{color:#fff;font-size:2.2rem;font-weight:800;}
.flip-bin-instruction{color:#fff;font-size:1rem;font-weight:700;margin-top:8px;letter-spacing:.04em;}
.scan-heading{font-size:1.3rem;font-weight:800;margin-bottom:16px;}
.hw-input-row input{flex:1;background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:16px;color:var(--text);font-family:'DM Mono',monospace;font-size:1.1rem;text-align:center;font-weight:700;}
.hw-hint{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--faint);text-align:center;margin-bottom:16px;}

.result-card{background:var(--card2);border:3px solid var(--border);border-radius:10px;padding:24px;text-align:center;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.result-card.success{border-color:var(--green);background:#eef8ef;}
.result-card.staged{border-color:var(--green);background:#e3f5e6;}
.result-card.error{border-color:var(--red);background:#fbeceb;}
.result-card.dupe{border-color:#e69500;background:#fff4dc;}
.flip-bin-loc{color:#fff;font-size:1rem;font-weight:600;opacity:.75;margin-top:4px;}
.result-bin{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:700;}
.result-bin-num{font-size:2.6rem;font-weight:800;color:var(--blue);line-height:1;margin-bottom:8px;}
.result-bin-num.success{color:var(--green);}
.result-bin-num.error{color:var(--red);}
.result-detail{font-size:.9rem;color:var(--muted);font-weight:600;}

.bins-panel{padding:0;}
.bins-panel-lbl{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;font-weight:700;}
.bin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--card2);font-size:.9rem;font-weight:600;}
.bin-row:last-child{border-bottom:none;}
.bin-row.tappable{cursor:pointer;}
.bin-row.tappable:active{background:var(--card2);}
.bin-num-chip{font-family:'DM Mono',monospace;font-weight:800;background:var(--card2);border:2px solid var(--border);padding:4px 10px;border-radius:6px;color:var(--blue);}
.bin-progress{font-family:'DM Mono',monospace;font-size:.85rem;color:var(--faint);font-weight:700;}
.staged-row{background:#eef8ef;}
.staged-badge{font-family:'DM Sans',monospace;font-size:.75rem;font-weight:800;color:var(--green);letter-spacing:.02em;white-space:nowrap;}
.empty-note{text-align:center;padding:30px 12px;color:var(--faint);font-size:.9rem;}

.confirm-box{background:var(--card);border:3px solid var(--orange);border-radius:10px;padding:20px;text-align:center;}
.confirm-title{font-weight:800;font-size:1.15rem;margin-bottom:8px;}
.confirm-sub{font-size:.88rem;color:var(--muted);margin-bottom:18px;}
.confirm-row{display:flex;gap:10px;}
.confirm-btn{flex:1;padding:16px;border-radius:8px;font-weight:800;font-size:.95rem;border:2px solid var(--border);font-family:'DM Sans',sans-serif;}
.confirm-btn.yes{background:var(--orange);color:#fff;border-color:var(--orange);}
.confirm-btn.no{background:var(--card2);color:var(--text);}

.action-btn{width:100%;padding:18px;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;font-size:1.05rem;border:none;font-family:'DM Sans',sans-serif;margin-top:6px;}
.step-label{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:12px;font-weight:700;}
</style>
</head>

<script>
const SB='https://hofijsiphyjpdvujjzfi.supabase.co';
const KEY='sb_publishable_wTbmXugtlItd1VGIzTMJZQ_Thd5v1Gp';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};

// ════════════════════════════════════════════════════════════════════
// OPERATIONAL MEMORY
//
// Every scan, stow, reset and problem now becomes a durable event in
// Supabase. Before this, all of it lived in JS variables that were
// wiped every 5 seconds by the polling loop, so PathIQ could not tell
// you whether a package had been stowed, by whom, or when -- and two
// devices could hold contradictory beliefs with nothing detecting it.
//
// PathIQ writes to `events` only. It deliberately does not write to
// `packages`: the event stream is the source of truth, and package
// rows are materialized from it. One writer per table.
// ════════════════════════════════════════════════════════════════════

// Who is standing at the bin. Asked once, then remembered on the device.
function getWorker(){
  let w=null;
  try{ w=localStorage.getItem('tp_worker'); }catch(e){}
  return w||null;
}
function setWorker(name){
  try{ localStorage.setItem('tp_worker',name); }catch(e){}
}
function ensureWorker(){
  let w=getWorker();
  if(!w){
    const entered=(typeof prompt==='function')?prompt('Your name (so scans are traceable):'):null;
    w=(entered&&entered.trim())?entered.trim():null;
    if(w)setWorker(w);
  }
  return w||('Device '+getDeviceId().slice(0,4).toUpperCase());
}
function getDeviceId(){
  let d=null;
  try{ d=localStorage.getItem('tp_device'); }catch(e){}
  if(!d){
    d=(Date.now().toString(36)+Math.random().toString(36).slice(2,8));
    try{ localStorage.setItem('tp_device',d); }catch(e){}
  }
  return d;
}

// Writes one operational event. The idempotency key is what makes a
// duplicate scanner broadcast, a double tap, or a retry after a dropped
// connection collapse into a single business fact -- enforced by a
// unique index in Postgres, not by a JS Set that dies on the next poll.
async function logEvent(eventType,opts){
  opts=opts||{};
  try{
    const body={
      org_id:opts.org_id||null,
      event_type:eventType,
      job_id:opts.job_id||null,
      driver_name:opts.driver_name||null,
      actor:opts.actor||getWorker()||('Device '+getDeviceId().slice(0,4).toUpperCase()),
      device_id:getDeviceId(),
      payload:opts.payload||{},
      idempotency_key:opts.idem||null,
      occurred_at:new Date().toISOString()
    };
    const r=await fetch(SB+'/rest/v1/events?on_conflict=idempotency_key',{
      method:'POST',
      headers:Object.assign({},H,{'Content-Type':'application/json','Prefer':'resolution=ignore-duplicates,return=minimal'}),
      body:JSON.stringify(body)
    });
    if(!r.ok){
      const txt=await r.text().catch(()=>'');
      console.log('[PathIQ] event write FAILED:',eventType,r.status,txt.slice(0,160));
    }
    return r.ok;
  }catch(e){
    console.log('event write failed:',eventType,e.message);
    return false;
  }
}

// Rebuilds today's warehouse reality from the event stream, so a device
// refresh, a second scanner, or a supervisor opening PathIQ an hour later
// all see the same thing. Returns {stowed, resetEpoch, detail}.
async function loadEventState(){
  const out={stowed:{},resetEpoch:{},detail:{}};
  try{
    const dayStart=new Date(); dayStart.setHours(0,0,0,0);
    const url=SB+'/rest/v1/events?event_type=in.(package.stowed,bin.reset)'
      +'&occurred_at=gte.'+encodeURIComponent(dayStart.toISOString())
      +'&order=occurred_at.asc&limit=5000&apikey='+KEY;
    const r=await fetch(url,{headers:H});
    if(!r.ok)return out;
    const rows=await r.json();
    if(!Array.isArray(rows))return out;
    rows.forEach(function(ev){
      const p=ev.payload||{};
      const bin=p.bin;
      if(!bin)return;
      if(ev.event_type==='bin.reset'){
        // A reset clears the bin's membership and opens a new epoch, so the
        // same package can legitimately be stowed again without its earlier
        // idempotency key blocking it.
        out.stowed[bin]=new Set();
        out.resetEpoch[bin]=ev.occurred_at;
        return;
      }
      if(ev.event_type==='package.stowed'&&p.code){
        if(!out.stowed[bin])out.stowed[bin]=new Set();
        out.stowed[bin].add(p.code);
        out.detail[p.code]={bin:bin,actor:ev.actor,at:ev.occurred_at};
      }
    });
  }catch(e){ console.log('event state load failed:',e.message); }
  return out;
}

function fmtEventTime(iso){
  try{
    const d=new Date(iso);
    let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0');
    const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
    return h+':'+m+' '+ap;
  }catch(e){ return ''; }
}

let jobs=[];
let binMap={};
let binProgress={};
let scannedByBin={};
let pendingPlacement=null;
let exceptionLog=[];
let stowDetail={};   // code -> {bin, actor, at}  rebuilt from events
let resetEpoch={};   // bin  -> ISO timestamp of that bin's last reset
let pendingInduct=null;

const SCREENS=['scHome','scAssignbins','scStow','scReceive','scInduct','scReset'];
const TITLES={scHome:'', scAssignbins:'Assign bins', scStow:'Stow', scReceive:'Receive', scInduct:'Induct', scReset:'Reset bin'};
const BACK_TARGET={scAssignbins:'home', scStow:'home', scReceive:'home', scInduct:'receive', scReset:'home'};

function goTo(screen){
  const id='sc'+screen.charAt(0).toUpperCase()+screen.slice(1);
  SCREENS.forEach(s=>document.getElementById(s).classList.toggle('on', s===id));
  const topBar=document.getElementById('topBar');
  if(id==='scHome'){
    topBar.innerHTML='<span id="topTitle" class="top-title"></span>';
  } else {
    const backTo=BACK_TARGET[id];
    topBar.innerHTML='<button class="back-btn" onclick="goTo(\'' + backTo + '\')">&#8249; Back</button><span id="topTitle" class="top-title">'+(TITLES[id]||'')+'</span>';
  }
  if(id==='scAssignbins'){ resetAssignBinResult(); loadUnassignedRoutes(); document.getElementById('assignBinInput').focus(); }
  if(id==='scStow'){ resetStowResult(); renderBinsPanel(); document.getElementById('stowInput').focus(); }
  if(id==='scReceive'){ resetReceiveResult(); document.getElementById('receiveInput').focus(); }
  if(id==='scReset'){ renderResetBinsPanel(); document.getElementById('resetConfirmArea').innerHTML=''; }
  if(id==='scInduct'){ renderInductSummary(); }
}

async function loadRoutes(){
  // Bindings first — loadRoutes keys progress by the bound bin code.
  await loadBinBindings();
  let fetchErrorOccurred=false;
  try{
    const r=await fetch(SB+'/rest/v1/jobs?status=in.(pending,assigned,in_transit)&order=created_at.asc&limit=50&apikey='+KEY,{headers:H});
    jobs=await r.json();
    if(!Array.isArray(jobs)){
      fetchErrorOccurred=true;
      const dbgElBad=document.getElementById('debugPanel');
      if(dbgElBad) dbgElBad.textContent='FETCH RETURNED NON-ARRAY (likely auth/permission error)\nhttp status = '+r.status+'\nresponse = '+JSON.stringify(jobs).slice(0,300);
      console.log('FETCH RETURNED NON-ARRAY', r.status, jobs);
      jobs=[];
    }
  }catch(e){
    fetchErrorOccurred=true;
    jobs=[];
    const dbgEl0=document.getElementById('debugPanel');
    if(dbgEl0) dbgEl0.textContent='FETCH FAILED\nerror = '+e.message+'\nname = '+e.name;
    console.log('FETCH FAILED', e);
  }

  binMap={};
  const newProgress={};

  // Scan history is no longer thrown away on every poll. It is rebuilt
  // from the durable event stream, which means it survives a refresh, a
  // process kill, and is shared across every device on the floor.
  const evState=await loadEventState();
  // Merge, never replace. A stow this device just made may not be in the
  // events table yet (or the write may have failed). Replacing memory with
  // the database copy every 5 seconds forgot those stows, which let the
  // same package be scanned in again and reset the counts.
  const prevStowed=scannedByBin||{}, prevDetail=stowDetail||{};
  const nextStowed=evState.stowed||{};
  Object.keys(prevStowed).forEach(bin=>{
    // A reset recorded elsewhere wins — do not resurrect cleared packages
    if(evState.resetEpoch&&evState.resetEpoch[bin]&&evState.resetEpoch[bin]!==resetEpoch[bin])return;
    if(!nextStowed[bin])nextStowed[bin]=new Set();
    prevStowed[bin].forEach(c=>nextStowed[bin].add(c));
  });
  scannedByBin=nextStowed;
  stowDetail=Object.assign({},prevDetail,evState.detail||{});
  resetEpoch=evState.resetEpoch||{};

  jobs.forEach((j, idx)=>{
    // A route should always have a real bin_label by the time it reaches
    // here. If one is somehow missing, don't silently skip the whole
    // route, assign a real, usable fallback bin right now based on its
    // position among today's active jobs, so scanning still works.
    // The bin comes from PathIQ's binding, not from the job record.
    // Until a worker opens a bin, the route is keyed by its own id so
    // progress is still tracked without inventing a bin number.
    const bound=binBindings[j.id];
    // bin_bindings is the ONLY source of truth for which bin holds a route.
    // jobs.bin_label is a mirror PathIQ writes for the dispatcher and driver
    // to read — trusting it here let stale values from before the bin
    // registry keep routing packages to bins that were never opened.
    const binNum=(bound&&bound.bin_code)||('JOB:'+j.id.slice(0,8));
    let stops=j.surge_stops;
    if(typeof stops==='string'){try{stops=JSON.parse(stops);}catch(e){stops=null;}}
    const stopList=Array.isArray(stops)?stops:[];
    const already=binProgress[binNum];
    // Sorted count comes from the event stream, not from a counter this
    // device happened to increment. Two scanners on the same bin now agree.
    const stowedHere=(scannedByBin[binNum]&&scannedByBin[binNum].size)||0;

    // ── EXPECTED COUNT IS PACKAGES, NOT STOPS ──
    // A stop is a delivery destination. A business receiving 5 packages is
    // ONE stop with FIVE physical packages, and all five must be stowed
    // before the route can be staged. Counting stops here meant a route
    // could show "complete" with packages still on the floor.
    let expectedPkgs=0;
    stopList.forEach(s=>{
      const arr=Array.isArray(s.pkgs)?s.pkgs:null;
      expectedPkgs += arr&&arr.length ? arr.length
                    : (parseInt(s.packages)||1);
    });

    newProgress[binNum]={total:expectedPkgs||stopList.length||1, stops:stopList.length, sorted:stowedHere, jobTitle:j.title||'Untitled Route', jobId:j.id, orgId:j.org_id||null};

    stopList.forEach((s,si)=>{
      const dest={binNum, jobId:j.id, jobTitle:j.title||'Untitled Route', address:s.address||'',
                  stopNum:(s.stop_number||si+1)};

      // ── INDEX EVERY PHYSICAL PACKAGE AT THIS STOP ──
      // SmartSort writes a pkgs[] array on each stop carrying every
      // physical package's own order_id and tracking_number. Each one is
      // a separate scannable object that must resolve to this bin.
      // Previously only the stop's primary package was indexed, so the
      // 2nd through Nth package at a multi-package address scanned as
      // "not on this route."
      if(Array.isArray(s.pkgs)){
        s.pkgs.forEach(pk=>{
          if(pk.tracking_number) binMap[String(pk.tracking_number).toUpperCase()]=dest;
          if(pk.order_id)        binMap[String(pk.order_id).toUpperCase()]=dest;
        });
      }

      // Stop-level identifiers still resolve, for routes built before
      // pkgs[] existed and for scanning a stop's primary label.
      const stableCode=s.tracking_number||s.order_id||s.orderId;
      if(stableCode) binMap[String(stableCode).toUpperCase()]=dest;
      const code=s.smart_id||s.id;
      if(code) binMap[String(code).toUpperCase()]=dest;
    });
    if(j.id) binMap[j.id.slice(0,8).toUpperCase()]={binNum, jobId:j.id, jobTitle:j.title||'Untitled Route', address:'', isRouteLevel:true};
  });
  binProgress=newProgress;

  // ── DIAGNOSTIC: confirm binMap actually built correctly, and whether
  // the specific real test package genuinely exists as a key ──
  const debugMsg1 = 'BINMAP BUILT\ncount = '+Object.keys(binMap).length
    +'\nhas TP6100001 = '+('TP6100001' in binMap)
    +'\nTP6100001 -> '+JSON.stringify(binMap['TP6100001']||null)
    +'\njobs fetched from Supabase = '+jobs.length
    +'\nraw jobs contain TP6100001 = '+JSON.stringify(jobs).includes('TP6100001');
  console.log(debugMsg1);
  const dbgEl = document.getElementById('debugPanel');
  if(dbgEl && !fetchErrorOccurred) dbgEl.textContent = debugMsg1;

  if(document.getElementById('scStow').classList.contains('on')) renderBinsPanel();
  if(document.getElementById('scReset').classList.contains('on')) renderResetBinsPanel();
}

// The route list under the scan area. Before the first scan it shows every
// loaded route. After a scan it shows only the route just scanned into, so
// the worker sees one answer. "Show all routes" brings the full list back —
// that is how a worker or lead finds the route still short a package.
let lastScannedBin=null;
let showAllRoutes=false;
function toggleAllRoutes(){ showAllRoutes=!showAllRoutes; renderBinsPanel(); }

function renderBinsPanel(){
  const el=document.getElementById('binsPanel');
  const nums=Object.keys(binProgress);
  if(!nums.length){
    el.innerHTML='<div class="empty-note">No active routes right now. Run SmartSort first.</div>';
    return;
  }
  const isDone=n=>binProgress[n].sorted>=binProgress[n].total;
  // Incomplete routes first — those are the ones that need attention
  const sortedNums=[...nums].sort((a,b)=>{
    if(isDone(a)!==isDone(b)) return isDone(a)?1:-1;
    return String(a).localeCompare(String(b),undefined,{numeric:true});
  });

  const focused = lastScannedBin && binProgress[lastScannedBin] && !showAllRoutes;
  const list = focused ? [lastScannedBin] : sortedNums;

  const rows=list.map(n=>{
    const p=binProgress[n];
    const complete=isDone(n);
    const noBin=String(n).startsWith('JOB:');
    const chip=noBin?'No bin yet':('Bin '+n);
    return '<div class="bin-row '+(complete?'staged-row':'')+'">'
      +'<span><span class="bin-num-chip">'+chip+'</span> '+p.jobTitle+'</span>'
      +(complete
        ? '<span class="staged-badge">&#10003; STAGED &middot; READY FOR PICKUP</span>'
        : noBin
          ? '<span class="bin-progress" style="opacity:.6">Scan a package to open a bin</span>'
          : '<span class="bin-progress">'+p.sorted+' of '+p.total+' packages sorted'
            +(p.stops?' <span style="opacity:.55">('+p.stops+' stops)</span>':'')+'</span>')
      +'</div>';
  }).join('');

  // Toggle link appears once a route has been scanned into
  let toggle='';
  if(lastScannedBin&&binProgress[lastScannedBin]){
    const notDone=nums.filter(n=>!isDone(n)).length;
    toggle='<div style="text-align:center;margin-top:8px;">'
      +'<a href="#" onclick="toggleAllRoutes();return false;" '
      +'style="font-size:.8rem;font-weight:700;color:var(--blue);text-decoration:none;">'
      +(showAllRoutes
        ? 'Show one route'
        : 'Show all routes ('+nums.length+(notDone?' · '+notDone+' not complete':'')+')')
      +'</a></div>';
  }
  el.innerHTML=rows+toggle;
}

// ── ASSIGN BINS ──
// Bins are permanent physical objects with fixed QR codes. A route only
// gets linked to one through this deliberate step, never guessed at by
// creation order. Scan the bin, then pick which of today's unassigned
// routes it carries.
let unassignedRoutes=[];
let pendingBinScan=null;

function renderAssignRouteList(){

// ── SCAN AUDIO FEEDBACK ──
// Both generated directly with the Web Audio API - no audio files, no
// network dependency, nothing added to the project beyond this code.
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playSuccessSound(){
  try{
    const ctx=getAudioCtx();
    const notes=[523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 - quick ascending win arpeggio
    notes.forEach((freq, i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='square';
      osc.frequency.value=freq;
      const startTime=ctx.currentTime + i*0.09;
      gain.gain.setValueAtTime(0.15, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime+0.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(startTime); osc.stop(startTime+0.1);
    });
  }catch(e){ console.log('Success sound failed:', e); }
}

function playErrorSound(){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime+0.35); // short falling buzz
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.4);
  }catch(e){ console.log('Error sound failed:', e); }
}

// ═════════════════════════════════════════════════════════════
// BIN OPENING
//
// SmartSort no longer assigns bins — it cannot know which physical
// containers are free. The worker discovers the binding during stow:
//
//   scan package → route resolved → route has no open bin?
//     → OPEN BIN → scan bin QR → SCAN LOCATION → scan location QR
//     → bin is bound to that route → rescan the package to confirm custody
//
// After that, every package for the same route goes straight to its bin.
// A bin stays bound until the driver picks the route up.
// ═════════════════════════════════════════════════════════════

// jobId -> {bin_code, location_code, state}
let binBindings={};
// Set while the worker is walking through OPEN BIN
// {phase:'bin'|'location', jobId, jobTitle, binCode}
let openingBin=null;

async function loadBinBindings(){
  try{
    const r=await fetch(SB+'/rest/v1/bin_bindings?select=*&state=in.(open,ready)',{headers:H});
    if(!r.ok)return;
    const rows=await r.json();
    binBindings={};
    (Array.isArray(rows)?rows:[]).forEach(b=>{
      if(b.job_id)binBindings[b.job_id]={bin_code:b.bin_code,location_code:b.location_code,state:b.state};
    });
  }catch(e){}
}

// A bin QR may encode "BIN:1A" or just "1A". A location QR may encode
// "LOC:A-07" or "A-07". Strip the prefix either way.
function normalizeBinCode(s){ return String(s||'').replace(/^BIN[:\s-]*/i,'').split('|')[0].trim().toUpperCase(); }
function normalizeLocCode(s){ return String(s||'').replace(/^(LOC|LOCATION)[:\s-]*/i,'').split('|')[0].trim().toUpperCase(); }

// Is this code already bound to a DIFFERENT live route?
function binCodeInUse(binCode, exceptJobId){
  return Object.entries(binBindings).some(([jid,b])=>
    b.bin_code===binCode && jid!==exceptJobId && (b.state==='open'||b.state==='ready'));
}

async function persistBinBinding(jobId, binCode, locCode, orgId){
  try{
    const r=await fetch(SB+'/rest/v1/bin_bindings',{
      method:'POST',
      headers:Object.assign({},H,{'Content-Type':'application/json','Prefer':'return=representation'}),
      body:JSON.stringify({
        org_id:orgId||null, bin_code:binCode, location_code:locCode,
        job_id:jobId, state:'open', opened_by:ensureWorker()
      })
    });
    if(!r.ok)throw new Error(await r.text());
    binBindings[jobId]={bin_code:binCode,location_code:locCode,state:'open'};
    // Mirror onto the job so the dispatcher and driver see the bin too
    fetch(SB+'/rest/v1/jobs?id=eq.'+jobId,{
      method:'PATCH',headers:Object.assign({},H,{'Content-Type':'application/json'}),
      body:JSON.stringify({bin_label:binCode})
    }).catch(()=>{});
    logEvent('bin.opened',{
      org_id:orgId||null, job_id:jobId,
      payload:{bin:binCode, location:locCode},
      idem:'binopen:'+jobId+':'+binCode
    });
    return true;
  }catch(e){
    console.log('[PathIQ] bin binding failed:',(e&&e.message?e.message:String(e)).slice(0,140));
    return false;
  }
}

// Scanned values are rendered into innerHTML — escape them.
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function handleStowScan(code){
  const clean=code.trim().toUpperCase();

  // ── DIAGNOSTIC: full chain from raw input through lookup result.
  // Appends to whatever the native bridge already wrote, so a single
  // screenshot shows every step together, not just the last one to run ──
  const keys=Object.keys(binMap);
  const found=(clean in binMap);
  const debugLines=[
    'RAW SCAN VALUE = '+JSON.stringify(code)+' (length '+code.length+')',
    'NORMALIZED VALUE = '+JSON.stringify(clean)+' (length '+clean.length+')',
    'EXACT LOOKUP: binMap has normalized value = '+found
  ];
  if(found){
    debugLines.push('MATCHED BIN = '+JSON.stringify(binMap[clean]));
  } else {
    debugLines.push('binMap has "TP6100001" (known-good key) = '+('TP6100001' in binMap));
    debugLines.push('keys starting with TP6100001 = '+JSON.stringify(keys.filter(k=>k.startsWith('TP6100001'))));
    debugLines.push('JSON.stringify(normalized) = '+JSON.stringify(clean));
    debugLines.push('JSON.stringify("TP6100001") = '+JSON.stringify('TP6100001'));
    debugLines.push('SAMPLE KEYS (first 10) = '+JSON.stringify(keys.slice(0,10)));
  }
  const debugMsg2=debugLines.join('\n');
  console.log(debugMsg2);
  const dbgEl2=document.getElementById('debugPanel');
  const existingDbg=dbgEl2 ? dbgEl2.textContent : '';
  if(dbgEl2) dbgEl2.textContent=(existingDbg?existingDbg+'\n\n':'')+debugMsg2;

  if(!clean)return;
  const card=document.getElementById('stowResult');
  card.style.display='flex';

  // ── STEP 2: confirming placement, expecting the bin's own QR code ──
  // A package was already scanned and is waiting on its bin confirmation.
  // This scan is checked against THAT specific pending bin, not looked up
  // as a package at all.
  if(pendingPlacement){
    // Bin QR codes encode "BIN:1A". Compare the normalized bin code —
    // comparing the raw scan rejected the correct bin as "Wrong Bin".
    // Once a bin is bound to a location, the worker can confirm placement
    // by scanning EITHER the bin's QR or that location's QR.
    if(clean===pendingPlacement.code){
      card.className='result-card';
      card.innerHTML='<div class="result-bin-num" style="font-size:2rem;">BIN '+esc(pendingPlacement.binNum)+'</div>'
        +(pendingPlacement.location?'<div class="result-detail" style="opacity:.75;">Location '+esc(pendingPlacement.location)+'</div>':'')
        +'<div class="result-detail" style="font-weight:700;margin-top:6px;">Already scanned — now scan the bin or location</div>';
      return;
    }
    const binMatch = normalizeBinCode(clean)===pendingPlacement.binNum;
    const locMatch = !!pendingPlacement.location &&
                     normalizeLocCode(clean)===pendingPlacement.location;
    if(binMatch||locMatch){
      playSuccessSound();
      const binNum=pendingPlacement.binNum;
      const stopForCard=pendingPlacement.stopNum||null;
      if(!scannedByBin[binNum]) scannedByBin[binNum]=new Set();
      // Never count the same physical package twice.
      if(scannedByBin[binNum].has(pendingPlacement.code)){
        pendingPlacement=null;
        const fi=document.getElementById('scanFlipInner');
        if(fi) fi.classList.remove('flipped');
        playErrorSound();
        card.className='result-card dupe';
        card.innerHTML='<div class="result-bin" style="color:#b36b00;">&#9888; ALREADY SCANNED</div>'
          +'<div class="result-bin-num" style="color:var(--orange);">Bin '+esc(binNum)+'</div>'
          +'<div class="result-detail">That package was already stowed. Nothing was counted.</div>';
        return;
      }
      scannedByBin[binNum].add(pendingPlacement.code);
      stowDetail[pendingPlacement.code]={bin:binNum,actor:ensureWorker(),at:new Date().toISOString()};
      binProgress[binNum].sorted=Math.min(binProgress[binNum].total, binProgress[binNum].sorted+1);
      lastScannedBin=binNum;

      // Durable record. The epoch suffix lets a package be legitimately
      // re-stowed after a bin reset, while still collapsing genuine
      // duplicates (repeat broadcast, double tap, retry) into one event.
      logEvent('package.stowed',{
        org_id:binProgress[binNum].orgId,
        job_id:binProgress[binNum].jobId,
        payload:{bin:binNum, code:pendingPlacement.code, route:pendingPlacement.jobTitle},
        idem:'stow:'+binProgress[binNum].jobId+':'+pendingPlacement.code+':'+(resetEpoch[binNum]||'r0')
      });
      const justCompleted=binProgress[binNum].sorted>=binProgress[binNum].total;
      const jobTitle=pendingPlacement.jobTitle;
      pendingPlacement=null;
      const flipInner=document.getElementById('scanFlipInner');

      // Flip directly back to the package-scanning side - the front
      // face content never changed, so nothing else needs resetting.
      if(flipInner) flipInner.classList.remove('flipped');

      if(justCompleted){
        card.className='result-card staged';
        card.innerHTML='<div class="result-bin" style="color:var(--green);">&#10003; Bin Complete</div><div class="result-bin-num success" style="font-size:2.1rem;">Bin '+binNum+'</div><div class="result-detail" style="color:var(--green);font-weight:700;">STAGED &middot; READY FOR PICKUP</div><div class="result-detail" style="margin-top:4px;">'+jobTitle+' &middot; all '+binProgress[binNum].total+' packages sorted</div>';
        const stagedJobId=binProgress[binNum].jobId;
        logEvent('bin.completed',{
          org_id:binProgress[binNum].orgId,
          job_id:stagedJobId,
          payload:{bin:binNum, route:jobTitle, packages:binProgress[binNum].total},
          idem:'bincomplete:'+stagedJobId+':'+(resetEpoch[binNum]||'r0')
        });
        if(stagedJobId){
          fetch(SB+'/rest/v1/jobs?id=eq.'+stagedJobId,{
            method:'PATCH', headers:Object.assign({},H,{'Content-Type':'application/json'}),
            body:JSON.stringify({staged_at:new Date().toISOString()})
          }).catch(()=>{});
          // The bin now holds a complete route. It stays bound to that
          // route — state moves open → ready, and only the driver pickup
          // releases it. A ready bin cannot be reused for another route.
          fetch(SB+'/rest/v1/bin_bindings?job_id=eq.'+stagedJobId+'&state=eq.open',{
            method:'PATCH', headers:Object.assign({},H,{'Content-Type':'application/json'}),
            body:JSON.stringify({state:'ready',ready_at:new Date().toISOString()})
          }).then(()=>{ if(binBindings[stagedJobId])binBindings[stagedJobId].state='ready'; })
            .catch(()=>{});
        }
      } else {
        card.className='result-card success';
        card.innerHTML='<div class="result-bin">&#10003; Confirmed</div><div class="result-bin-num success">Bin '+binNum+'</div><div class="result-detail">'+binProgress[binNum].sorted+' of '+binProgress[binNum].total+' sorted</div>'
          +(stopForCard?'<div class="result-detail" style="font-weight:800;font-size:1.05rem;margin-top:4px;">STOP '+stopForCard+'</div>':'');
      }
      renderBinsPanel();
    } else {
      // Wrong bin scanned. Package stays pending - worker can try the
      // correct bin without needing to re-scan the package.
      playErrorSound();
      card.className='result-card error';
      const where=pendingPlacement.location
        ? 'Bin '+pendingPlacement.binNum+' or location '+pendingPlacement.location
        : 'Bin '+pendingPlacement.binNum;
      card.innerHTML='<div class="result-bin">Wrong Bin</div><div class="result-bin-num error" style="font-size:1.4rem;">Expected '+where+'</div><div class="result-detail">Scanned: '+esc(clean)+'</div>';
    }
    return;
  }

  // ══ OPEN NEW BIN — collect the bin QR and the location QR ══
  // The QR type is recognized by its prefix (BIN: or LOC:), so the worker
  // can scan them in either order and a location can never be saved as a
  // bin name.
  if(openingBin){
    const isLoc=/^(LOC|LOCATION)[:\s-]/i.test(clean);
    const isBin=/^BIN[:\s-]/i.test(clean);

    // A package scanned mid-open: remind, do not lose the open in progress
    if(!isLoc&&!isBin&&binMap[clean]){
      playErrorSound();
      card.className='result-card error';
      card.innerHTML='<div class="result-bin">Finish Opening The Bin</div>'
        +'<div class="result-detail">Scan '+(!openingBin.binCode?'the BIN QR':'the LOCATION QR')+' first, then scan the package again.</div>';
      return;
    }

    if(isLoc||(!isBin&&openingBin.binCode&&!openingBin.locCode)){
      const loc=normalizeLocCode(clean);
      if(!loc){playErrorSound();return;}
      openingBin.locCode=loc;
    }else{
      const bin=normalizeBinCode(clean);
      if(!bin){playErrorSound();return;}
      if(binCodeInUse(bin,openingBin.jobId)){
        playErrorSound();
        card.className='result-card error';
        card.innerHTML='<div class="result-bin">Bin In Use</div>'
          +'<div class="result-bin-num error" style="font-size:1.6rem;">BIN '+esc(bin)+'</div>'
          +'<div class="result-detail">That bin already holds another route. Scan an empty bin.</div>';
        return;
      }
      openingBin.binCode=bin;
    }

    // Still missing one of the two — prompt for it
    if(!openingBin.binCode||!openingBin.locCode){
      playSuccessSound();
      card.className='result-card';
      card.innerHTML=(openingBin.binCode
          ?'<div class="result-bin-num" style="font-size:2rem;color:var(--blue);">BIN '+esc(openingBin.binCode)+'</div>'
            +'<div class="result-detail" style="font-weight:700;margin-top:6px;">SCAN LOCATION QR</div>'
          :'<div class="result-detail" style="opacity:.75;">Location '+esc(openingBin.locCode)+'</div>'
            +'<div class="result-bin-num" style="font-size:1.8rem;color:var(--blue);">SCAN BIN QR</div>');
      return;
    }

    // Both scanned — bind the bin to the route
    const ok=await persistBinBinding(openingBin.jobId,openingBin.binCode,openingBin.locCode,openingBin.orgId);
    if(!ok){
      playErrorSound();
      card.className='result-card error';
      card.innerHTML='<div class="result-bin">Could Not Open Bin</div>'
        +'<div class="result-detail">The binding did not save. Check connection and scan the bin again.</div>';
      openingBin.binCode=null; openingBin.locCode=null;
      return;
    }
    const opened={bin:openingBin.binCode,loc:openingBin.locCode,title:openingBin.jobTitle};
    lastScannedBin=opened.bin;
    // Move this route's progress off its temporary key onto the real bin
    const tmpKey='JOB:'+String(openingBin.jobId).slice(0,8);
    if(binProgress[tmpKey]&&!binProgress[opened.bin]){binProgress[opened.bin]=binProgress[tmpKey];delete binProgress[tmpKey];}
    if(scannedByBin[tmpKey]&&!scannedByBin[opened.bin]){scannedByBin[opened.bin]=scannedByBin[tmpKey];delete scannedByBin[tmpKey];}
    openingBin=null;
    playSuccessSound();
    card.className='result-card staged';
    card.innerHTML='<div class="result-bin" style="color:var(--green);">&#10003; Bin Open</div>'
      +'<div class="result-bin-num success" style="font-size:2.1rem;">BIN '+esc(opened.bin)+'</div>'
      +'<div class="result-detail" style="opacity:.75;">Location '+esc(opened.loc)+' &middot; '+esc(opened.title)+'</div>'
      +'<div class="result-detail" style="margin-top:6px;color:var(--blue);font-weight:700;">SCAN THE PACKAGE AGAIN</div>';
    renderBinsPanel();
    return;
  }

  // ── STEP 1: scanning a package - shows the instruction only, does not
  // count until the matching bin is actually scanned ──
  const match=binMap[clean];

  if(!match){
    card.className='result-card error';
    // Say WHY it did not match. "Unrecognized" sends a worker hunting for a
    // scanner problem when the real cause is usually that the manifest for
    // this package has not been uploaded, or its route already completed.
    const routeCount=Object.keys(binProgress).length;
    const reason = routeCount===0
      ? 'No active routes are loaded in PathIQ. Upload the manifest in the dispatcher first.'
      : 'This package is not on any of the '+routeCount+' active route'+(routeCount!==1?'s':'')+'. Check the manifest was uploaded, or set it aside as an exception.';
    card.innerHTML='<div class="result-bin">Not On Any Route</div>'
      +'<div class="result-bin-num error" style="font-size:1.25rem;word-break:break-all;">'+esc(clean)+'</div>'
      +'<div class="result-detail">'+reason+'</div>';
    return;
  }

  // ══ ALREADY SCANNED ══
  // Look in EVERY bin, not just the one this package maps to right now —
  // right after a bin opens, the route is briefly tracked under a temporary
  // key, and checking only that key let a repeat scan slip through.
  const stowedIn=Object.keys(scannedByBin).find(k=>scannedByBin[k]&&scannedByBin[k].has(clean));
  if(stowedIn){
    const d=stowDetail[clean]||{};
    const bound=binBindings[match.jobId]||{};
    const bin=d.bin||stowedIn;
    const loc=bound.location_code?(' at location '+bound.location_code):'';
    const who=d.actor?(' by '+d.actor):'';
    const when=d.at?(' at '+fmtEventTime(d.at)):'';
    playErrorSound();
    if(navigator.vibrate)navigator.vibrate([120,80,120]);
    card.className='result-card dupe';
    card.style.display='flex';
    card.innerHTML='<div class="result-bin" style="color:#b36b00;font-size:1rem;">&#9888; ALREADY SCANNED</div>'
      +'<div class="result-bin-num" style="color:var(--orange);font-size:2rem;">Bin '+esc(bin)+'</div>'
      +'<div class="result-detail" style="font-weight:700;">This package is already in Bin '+esc(bin)+esc(loc)+'.</div>'
      +'<div class="result-detail">Stowed'+esc(who)+esc(when)+'. Do not scan it again — move to the next package.</div>';
    return;
  }
  if(!scannedByBin[match.binNum]) scannedByBin[match.binNum]=new Set();

  // ══ Does this package's route have an open bin yet? ══
  // If not, the worker must open one before any package can be stowed.
  // This is the first package off the truck for this route.
  const binding=binBindings[match.jobId];
  if(!binding||!binding.bin_code){
    openingBin={jobId:match.jobId, jobTitle:match.jobTitle, binCode:null, locCode:null,
                orgId:(binProgress[match.binNum]||{}).orgId||null, pkgCode:clean};
    playSuccessSound();
    card.className='result-card';
    card.style.display='flex';
    card.innerHTML='<div class="result-bin" style="color:var(--blue);">'+match.jobTitle+'</div>'
      +'<div class="result-bin-num" style="font-size:2.2rem;color:var(--blue);">OPEN NEW BIN</div>'
      +'<div class="result-detail">No bin is open for this route yet.</div>'
      +'<div class="result-detail" style="margin-top:6px;font-weight:700;">Scan an empty bin\u2019s QR code.</div>';
    return;
  }

  // Route has a bin. Use the real bound bin code, not a SmartSort guess.
  pendingPlacement={binNum:binding.bin_code, location:binding.location_code||null,
                    code:clean, jobTitle:match.jobTitle, stopNum:match.stopNum||null};
  const flipStop=document.getElementById('flipBinStop');
  if(flipStop) flipStop.textContent=match.stopNum?('STOP '+match.stopNum):'';
  const flipBinNumber=document.getElementById('flipBinNumber');
  const flipInner=document.getElementById('scanFlipInner');
  if(flipBinNumber) flipBinNumber.textContent='BIN '+binding.bin_code;
  const flipLoc=document.getElementById('flipBinLoc');
  if(flipLoc) flipLoc.textContent=binding.location_code?('Location '+binding.location_code):'';
  const flipInstr=document.getElementById('flipBinInstr');
  if(flipInstr) flipInstr.textContent=binding.location_code?'SCAN BIN OR LOCATION':'SCAN BIN QR';
  if(flipInner) flipInner.classList.add('flipped');
  // The card itself is the single shared space communicating this step -
  // this second card stays hidden here so nothing duplicates it.
  card.style.display='none';
}

function resetReceiveResult(){
  const card=document.getElementById('receiveResult');
  card.className='result-card';
  card.innerHTML='<div class="result-bin">Ready</div><div class="result-bin-num" style="font-size:1.3rem;color:var(--faint);">Scan the package to receive it</div>';
}

function handleReceiveScan(code){
  const clean=code.trim().toUpperCase();
  if(!clean)return;
  const card=document.getElementById('receiveResult');
  const match=binMap[clean];

  if(!match){
    card.className='result-card error';
    card.innerHTML='<div class="result-bin">Not Found</div><div class="result-bin-num error" style="font-size:1.4rem;">Not in manifest</div><div class="result-detail">"'+code+'" does not match anything SmartSort has assigned.</div>';
    return;
  }

  pendingInduct={code:clean, binNum:match.binNum, jobTitle:match.jobTitle, address:match.address};
  card.className='result-card success';
  card.innerHTML='<div class="result-bin">Received</div><div class="result-bin-num success">Bin '+match.binNum+'</div><div class="result-detail">'+match.jobTitle+'</div>';
  setTimeout(function(){ goTo('induct'); }, 500);
}

function renderInductSummary(){
  const el=document.getElementById('inductSummary');
  if(!pendingInduct){ el.innerHTML='<div class="empty-note">No package pending induction.</div>'; return; }
  el.innerHTML='<div class="result-bin">Pending Induction</div><div class="result-bin-num success">Bin '+pendingInduct.binNum+'</div><div class="result-detail">'+pendingInduct.jobTitle+(pendingInduct.address?' &middot; '+pendingInduct.address:'')+'</div><div class="result-detail" style="margin-top:6px;font-family:\'DM Mono\',monospace;font-size:.7rem;">'+pendingInduct.code+'</div>';
}

function confirmInduct(){
  if(!pendingInduct)return;
  const record=Object.assign({}, pendingInduct, {time:new Date()});
  exceptionLog.push(record);

  // Previously this was the whole story: a push into a local array that
  // vanished on refresh. Every Problem/Induct recovery performed in a
  // shift left no trace anywhere. Now it is a durable event, which is what
  // makes "this package has been through Problem three times" answerable.
  const inf=binProgress[pendingInduct.binNum]||{};
  logEvent('package.inducted',{
    org_id:inf.orgId,
    job_id:inf.jobId,
    payload:{bin:pendingInduct.binNum, code:pendingInduct.code,
             route:pendingInduct.jobTitle||'', address:pendingInduct.address||'',
             reason:'missed_package_recovery'},
    idem:'induct:'+(inf.jobId||pendingInduct.binNum)+':'+pendingInduct.code+':'+Date.now()
  });
  const doneCode=pendingInduct.code;
  pendingInduct=null;
  goTo('stow');
  document.getElementById('stowResult').innerHTML='<div class="result-bin">Inducted</div><div class="result-bin-num" style="font-size:1.2rem;color:var(--faint);">Now scan '+doneCode+' to stow it</div>';
}

function renderResetBinsPanel(){
  const el=document.getElementById('resetBinsPanel');
  const nums=Object.keys(binProgress);
  if(!nums.length){
    el.innerHTML='<div class="bins-panel-lbl">Active Bins</div><div class="empty-note">No active bins right now.</div>';
    return;
  }
  const sortedNums=[...nums].sort(function(a,b){ return parseInt(a)-parseInt(b); });
  el.innerHTML='<div class="bins-panel-lbl">Select a bin to reset</div>' + sortedNums.map(function(n){
    const p=binProgress[n];
    return '<div class="bin-row tappable" onclick="askResetConfirm(\''+n+'\')">'
      +'<span><span class="bin-num-chip">Bin '+n+'</span> '+p.jobTitle+'</span>'
      +'<span class="bin-progress">'+p.sorted+' of '+p.total+' sorted</span>'
      +'</div>';
  }).join('');
}

function askResetConfirm(binNum){
  const p=binProgress[binNum];
  document.getElementById('resetConfirmArea').innerHTML=
    '<div class="confirm-box">'
    +'<div class="confirm-title">Reset Bin '+binNum+'?</div>'
    +'<div class="confirm-sub">'+p.sorted+' of '+p.total+' packages currently marked sorted. This clears its progress back to 0 so it can be sorted again from scratch.</div>'
    +'<div class="confirm-row">'
    +'<button class="confirm-btn no" onclick="document.getElementById(\'resetConfirmArea\').innerHTML=\'\'">Cancel</button>'
    +'<button class="confirm-btn yes" onclick="doResetBin(\''+binNum+'\')">Reset it</button>'
    +'</div></div>';
}

function doResetBin(binNum){
  const info=binProgress[binNum]||{};
  const now=new Date().toISOString();

  if(binProgress[binNum]) binProgress[binNum].sorted=0;
  if(scannedByBin[binNum]) scannedByBin[binNum].clear();
  resetEpoch[binNum]=now;

  // A reset used to change only local memory, leaving Supabase still
  // believing the bin was staged and ready for pickup while PathIQ showed
  // it empty. Both now move together.
  logEvent('bin.reset',{
    org_id:info.orgId,
    job_id:info.jobId,
    payload:{bin:binNum, route:info.jobTitle||'', cleared:info.total||0},
    idem:'binreset:'+(info.jobId||binNum)+':'+now
  });
  if(info.jobId){
    fetch(SB+'/rest/v1/jobs?id=eq.'+info.jobId,{
      method:'PATCH', headers:Object.assign({},H,{'Content-Type':'application/json'}),
      body:JSON.stringify({staged_at:null})
    }).catch(function(){});
  }
  document.getElementById('resetConfirmArea').innerHTML='<div class="result-card success"><div class="result-bin">Reset</div><div class="result-bin-num success">Bin '+binNum+'</div><div class="result-detail">Ready to be sorted again.</div></div>';
  renderResetBinsPanel();
}

document.getElementById('assignBinInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ handleAssignBinScan(e.target.value); e.target.value=''; }
});
document.getElementById('stowInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    const dbgClear=document.getElementById('debugPanel');
    if(dbgClear) dbgClear.textContent='';
    handleStowScan(e.target.value); e.target.value='';
  }
});
document.getElementById('receiveInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ handleReceiveScan(e.target.value); e.target.value=''; }
});
document.addEventListener('click', function(){
  if(document.getElementById('scStow').classList.contains('on')) document.getElementById('stowInput').focus();
  if(document.getElementById('scReceive').classList.contains('on')) document.getElementById('receiveInput').focus();
});

loadRoutes();
setInterval(loadRoutes, 5000);

// ── RELIABILITY FIX ──
// Both of these call the exact same, unmodified loadRoutes() above.
// Neither changes the fetch, the query, or how routes are matched or
// displayed - they only add two more real moments that trigger it,
// on top of the existing 5-second interval, which still runs exactly
// as before.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') loadRoutes();
});
window.addEventListener('online', loadRoutes);

// ── NATIVE SCANNER BRIDGE ──
// The FARSET/ARBOR G47 does not emulate a keyboard -- confirmed by two
// direct tests, inside the packaged app and in plain Chrome, both
// receiving nothing on scan. It only broadcasts. This listens for that
// broadcast via the native FarsetScanner plugin and routes the decoded
// value into the exact same functions a keyboard-wedge scan would have
// called, based on whichever screen is actually open. Nothing about the
// existing scan-handling logic itself changes.
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FarsetScanner) {
  window.Capacitor.Plugins.FarsetScanner.addListener('scan', function(data){
    // ── DIAGNOSTIC: exact raw shape from the native plugin, before
    // anything touches it ──
    const bridgeDbg = 'NATIVE BRIDGE EVENT RECEIVED\n'
      +'typeof data = '+typeof data+'\n'
      +'raw data = '+JSON.stringify(data)+'\n'
      +'data.value = '+JSON.stringify(data.value)+'\n'
      +'typeof data.value = '+typeof data.value;
    console.log(bridgeDbg);
    const dbgElBridge=document.getElementById('debugPanel');
    if(dbgElBridge) dbgElBridge.textContent=bridgeDbg;

    const value = data.value;
    if(!value) return;
    if(document.getElementById('scStow').classList.contains('on')){
      handleStowScan(value);
    } else if(document.getElementById('scReceive').classList.contains('on')){
      handleReceiveScan(value);
    } else if(document.getElementById('scAssignbins').classList.contains('on')){
      handleAssignBinScan(value);
    }
  });
}

// ── Zebra TC56 / DataWedge bridge ──
// Same routing as the Farset block above, fed by the ZebraScanner plugin
// instead. DataWedge is configured with Intent Output -> Broadcast Intent,
// action com.tackpath.pathiq.SCAN, associated app com.tackpath.pathiq.
// Retries briefly because the native plugin can register a moment after
// the page script runs; attaches exactly once.
(function attachZebra(tries){
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ZebraScanner) {
    if (window._zebraAttached) return;
    window._zebraAttached = true;
    window.Capacitor.Plugins.ZebraScanner.addListener('scan', function(data){
      const value = data && data.value;
      const dbg=document.getElementById('debugPanel');
      if(dbg) dbg.textContent='SCAN RAW: '+JSON.stringify(value)+
        (pendingPlacement?'  | waiting for bin '+pendingPlacement.binNum+
          (pendingPlacement.location?' / loc '+pendingPlacement.location:''):'');
      if(!value) return;
      if(document.getElementById('scStow').classList.contains('on')){
        handleStowScan(value);
      } else if(document.getElementById('scReceive').classList.contains('on')){
        handleReceiveScan(value);
      } else if(document.getElementById('scAssignbins').classList.contains('on')){
        handleAssignBinScan(value);
      }
    });
    return;
  }
  if (tries < 20) setTimeout(function(){ attachZebra(tries+1); }, 500);
})(0);

</script>
